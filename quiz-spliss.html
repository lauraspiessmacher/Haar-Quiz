<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spliss- &amp; Bruch-Check</title>
<style>
:root{
  --bg:#382F2E;
  --surface:#433836;
  --cream:#F3ECE2;
  --muted:#C9BCAE;
  --line:rgba(243,236,226,.5);
  --line-soft:rgba(243,236,226,.18);
  --taupe:#9E8C80;
  --sand:#C9BCAE;
  --warn-bg:#4A3D35;
  --serif:"Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "Noto Serif", Georgia, serif;
  --sans:"Avenir Next", Avenir, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#382F2E; --cream:#F3ECE2; } }
:root[data-theme="dark"]{ --bg:#382F2E; --cream:#F3ECE2; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font-family:var(--sans);font-weight:400;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:28px 22px 48px}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.1}
p{margin:0 0 14px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sand);outline-offset:3px}

/* Start */
.start{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;position:relative}
.strand{position:absolute;top:0;right:-22px;width:62%;max-width:300px;opacity:.55;pointer-events:none}
.by{font-size:14px;color:var(--muted);margin-bottom:28px;letter-spacing:.02em}
.start h1{font-size:clamp(46px,13vw,68px);letter-spacing:-.01em;margin-bottom:22px;max-width:9ch}
.start .lead{font-size:18px;color:var(--cream);max-width:34ch}
.start .how{color:var(--muted);font-size:15px;max-width:38ch;margin-bottom:30px}
.primary{display:block;width:100%;padding:17px 20px;border:1px solid var(--cream);border-radius:999px;background:var(--cream);color:var(--bg);font-weight:500;font-size:17px;cursor:pointer}
.primary:active{transform:scale(.99)}
.ghost{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:4px}
.fine{font-size:13px;color:var(--muted);line-height:1.5;margin-top:26px;border-top:1px solid var(--line-soft);padding-top:16px}

/* Question */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;min-height:40px}
.count{font-size:14px;color:var(--muted)}
.bar{height:2px;background:var(--line-soft);border-radius:2px;overflow:hidden;margin-bottom:38px}
.bar span{display:block;height:100%;background:var(--cream);transition:width .35s ease}
.q h2{font-size:clamp(30px,8vw,38px);margin-bottom:12px}
.hint{color:var(--muted);font-size:15px;margin-bottom:22px}
.answers{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.ans{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:transparent;cursor:pointer;font-size:16.5px;line-height:1.4;transition:background .15s,border-color .15s,color .15s}
.ans .dot{flex:0 0 18px;height:18px;margin-top:2px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}
.ans.multi .dot{border-radius:5px}
.ans[aria-pressed="true"]{background:var(--cream);color:var(--bg);border-color:var(--cream)}
.ans[aria-pressed="true"] .dot{border-color:var(--bg);background:var(--bg)}
.ans[aria-pressed="true"] .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--cream)}
.ans.multi[aria-pressed="true"] .dot::after{border-radius:1px}
@media (hover:hover){.ans:hover{border-color:var(--cream)}}
.next{margin-top:26px}
.next[disabled]{opacity:.35;cursor:default}

/* Result */
.res-kicker{font-size:15px;color:var(--muted);margin-bottom:8px}
.res h1{font-size:clamp(44px,12vw,62px);margin-bottom:20px}
.res .intro{font-size:18px;margin-bottom:28px}
.block{border-top:1px solid var(--line-soft);padding:22px 0 8px}
.block h3{font-size:25px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.mark{display:inline-grid;place-items:center;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;font-family:var(--sans);font-size:14px;font-weight:400}
.box{border:1px solid var(--line);border-radius:16px;padding:18px 18px 6px;margin:0 0 18px}
.box h3{font-size:22px;margin-bottom:8px}
.warn{background:var(--warn-bg);border-color:var(--sand);margin-bottom:30px}
.warn h3{color:var(--sand)}
details{border-top:1px solid var(--line-soft);padding:18px 0}
summary{cursor:pointer;font-family:var(--serif);font-size:24px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--sans);font-weight:400;font-size:24px;color:var(--muted)}
details[open] summary::after{content:"–"}
details .inner{padding-top:14px}
.tbl{overflow-x:auto;margin:6px 0 18px;border:1px solid var(--line-soft);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:14.5px}
th,td{text-align:left;padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--line-soft)}
th{font-weight:500;color:var(--muted)}
tr:last-child td{border-bottom:none}
ul{padding-left:20px;margin:0 0 14px}
li{margin-bottom:8px}
.closing{font-family:var(--serif);font-size:23px;line-height:1.3;border-top:1px solid var(--line-soft);padding-top:24px;margin:10px 0 26px}
.actions{display:flex;flex-direction:column;gap:6px;align-items:center}

.fade{animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar span{transition:none}}

.ans.has-ico{align-items:center}
.ans .ico{flex:0 0 28px;width:28px;height:46px}
.ans[aria-pressed="true"] .ico path{stroke:#382F2E}
.res-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.res-art{flex:0 0 60px;width:60px;height:100px;margin-top:4px}
.subtype{color:var(--muted);font-size:16px;margin:-8px 0 24px}
.code{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 10px;margin-right:8px;color:var(--cream);font-size:14px}
.steps{padding-left:22px;margin:0 0 22px}
.steps li{margin-bottom:10px}
strong{font-weight:500}
.secondary{display:block;width:100%;padding:15px 20px;border:1px solid var(--cream);border-radius:999px;background:transparent;color:var(--cream);font-weight:500;font-size:16px;cursor:pointer}
.copied{font-size:14px;color:var(--muted);min-height:20px}
.actions .primary{margin-top:8px}
.links{margin-top:10px;gap:10px}
.links .secondary{margin:0}
.intro p{font-size:18px}
.box p{margin-bottom:12px}
.ans .ico{flex:0 0 28px;width:28px;height:46px}
.ans[aria-pressed="true"] .ico path,.ans[aria-pressed="true"] .ico circle{stroke:#382F2E}
.ans[aria-pressed="true"] .ico circle.fill{fill:#382F2E}
.lvl{display:flex;gap:6px;margin:-6px 0 24px}
.lvl span{flex:1;height:6px;border-radius:3px;background:var(--line-soft)}
.lvl span.on{background:var(--cream)}
.lvlnames{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:-18px 0 26px}
.cause{border:1px solid var(--line);border-radius:16px;padding:16px 18px 4px;margin:0 0 14px}
.cause h4{font-family:var(--serif);font-weight:500;font-size:21px;margin:0 0 8px}
.spl{display:flex;gap:14px;align-items:flex-start;margin:0 0 16px}
.spl svg{flex:0 0 28px;width:28px;height:46px;margin-top:2px}
.spl p{margin:0}
.two{display:grid;gap:12px;margin:6px 0 18px}
@media (min-width:520px){ .two{grid-template-columns:1fr 1fr} }
.two .box{margin:0}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
/* ---------- Spliss- & Bruch-Check: Wie kaputt sind deine Haare, welcher Spliss, woher kommt der Bruch? ----------
   Lauras Grundhaltung: Reibung ist der Hauptgegner, Prävention schlägt Reparatur, jede Wäsche endet mit Pflege,
   Spliss lässt sich nicht reparieren (nur kaschieren, weg nur mit der Schere). */
const ICO = {
 y:'<path d="M14 2 V28 M14 28 Q10 36 7 44 M14 28 Q18 36 21 44"/>',
 baum:'<path d="M14 2 V20 M14 20 Q10 26 9 32 M14 20 Q18 26 19 32 M9 32 Q6 38 5 44 M9 32 Q11 38 11 44 M19 32 Q17 38 17 44 M19 32 Q22 38 23 44"/>',
 punkt:'<path d="M14 2 V37"/><circle class="fill" cx="14" cy="40.5" r="3.4" fill="#F3ECE2"/>',
 loch:'<path d="M14 2 V16 Q8 23 14 30 Q20 23 14 16 M14 30 V44"/>',
 frans:'<path d="M14 2 V32 M14 32 L10 41 M14 32 L13 44 M14 32 L16 43 M14 32 L19 40"/>',
 knoten:'<path d="M14 2 V20 Q8 24 13 28 Q19 30 15 23 Q12 20 14 30 V44"/>'
};
const ico = k => `<svg class="ico" viewBox="0 0 28 46" fill="none" stroke="#F3ECE2" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">${ICO[k]}</svg>`;
const QS = [
 {id:"gefuehl", t:"Wie fühlen sich deine Längen und Spitzen an, wenn sie trocken sind?", a:[
  ["Weich und geschmeidig",{d:0}],["Etwas trocken, aber eigentlich okay",{d:1,pf:1}],["Rau und strohig, sie verknoten schnell",{d:2,pf:2}],["Strohig, und nass fühlen sie sich fast an wie Gummi",{d:3,gummi:1,ch:2}]]},
 {id:"dehnung", t:"Mach den Dehnungstest: Was passiert?", h:"Nimm ein ausgefallenes Haar, mach es nass und zieh vorsichtig an beiden Enden.", a:[
  ["Es dehnt sich ein Stück und geht wieder zurück",{d:0}],["Es reißt sofort, fast ohne sich zu dehnen",{d:1,sprode:1,pf:2}],["Es dehnt sich sehr weit, bleibt ausgeleiert oder reißt dann",{d:3,gummi:1,ch:2}],["Habe ich nicht gemacht",{d:0}]]},
 {id:"bruch", t:"Siehst du kurze Haare, die abstehen?", h:"Am besten, wenn du die Haare glatt nach hinten streichst. Kurze Haare sind nicht immer abgebrochen: Jedes Haar ist in einer anderen Wachstumsphase, deshalb wachsen immer auch neue Haare nach. Nachwachsende Haare haben eine feine, spitz zulaufende Spitze. Abgebrochene Haare haben ein stumpfes oder ausgefranstes Ende. Wenn du es nicht erkennen kannst, nimm einfach „Weiß ich nicht“.", a:[
  ["Nein",{d:0}],["Ja, mit feiner Spitze, also eher nachwachsende Haare",{d:0,neu:1}],["Ja, mit stumpfem Ende, vor allem am Oberkopf oder am Ansatz",{d:1,zug:2,bOben:1}],["Ja, mit stumpfem Ende, vor allem in den Längen, etwa auf Schulterhöhe",{d:1,reib:2,bMitte:1}],["Ja, mit stumpfem Ende, überall verteilt",{d:2,ch:1,hz:1,bUeberall:1}],["Weiß ich nicht",{d:0,unsicher:1}]]},
 {id:"kaemmen", t:"Was passiert beim Kämmen oder Bürsten?", a:[
  ["Es geht leicht durch",{d:0}],["Es ziept und verknotet sich schnell",{d:1,reib:1,pf:1}],["Ich finde viele kurze, abgebrochene Haare im Waschbecken, im Schoß oder in der Bürste",{d:2,reib:2}]]},
 {id:"spliss", multi:1, t:"Schau dir etwa zehn Spitzen genau an. Was siehst du?", h:"Am besten vor einem hellen Hintergrund. Du kannst mehreres auswählen.", a:[
  ["Y-Spliss: die Spitze ist in zwei Teile gespalten",{d:1,s:"y",ico:"y"}],
  ["Baum-Spliss: die Spitze ist mehrfach verzweigt",{d:2,s:"baum",ico:"baum"}],
  ["Weißer Punkt: eine helle Stelle an der Haarspitze",{d:1,s:"punkt",ico:"punkt"}],
  ["Loch: das Haar ist in der Länge gespalten wie ein kleines Auge",{d:2,s:"loch",ico:"loch"}],
  ["Ausgefranste, dünne Spitzen",{d:1,s:"frans",ico:"frans",reib:1}],
  ["Knötchen: kleine Knoten im Haar",{d:1,s:"knoten",ico:"knoten",reib:1}],
  ["Ich sehe keinen Spliss",{x:1,keiner:1}],["Ich erkenne es nicht genau",{x:1}]]},
 {id:"wo", t:"Wo findest du Spliss?", if:()=>splissDa(), a:[
  ["Nur ganz unten in den Spitzen",{wo:"spitzen"}],["Auch weiter oben in den Längen",{d:2,wo:"laengen"}],["Weiß ich nicht genau",{wo:"?"}]]},
 {id:"schnitt", t:"Wann warst du zuletzt beim Haare schneiden?", a:[
  ["Vor weniger als drei Monaten",{m:2}],["Vor drei bis sechs Monaten",{m:5}],["Vor sechs bis zwölf Monaten",{m:9,d:1}],["Vor mehr als einem Jahr",{m:13,d:1}]]},
 {id:"chemie", multi:1, t:"Welche chemischen Behandlungen hattest du in den letzten zwölf Monaten?", h:"Du kannst mehreres auswählen.", a:[
  ["Blondiert oder Strähnchen",{d:3,ch:3,blond:1}],["Dauerhaft gefärbt",{d:1,ch:1}],["Dauerwelle, chemische Glättung oder Keratin-Glättung",{d:3,ch:3,perm:1}],["Nichts davon",{x:1}]]},
 {id:"hitze", t:"Wie oft stylst du mit Hitze?", h:"Glätteisen, Lockenstab, Multistyler oder heißes Föhnen.", a:[
  ["Nie oder fast nie",{hitze:0}],["Ein- bis zweimal pro Woche",{d:1,hz:1,hitze:1}],["Drei- bis fünfmal pro Woche",{d:2,hz:2,hitze:2}],["Täglich",{d:3,hz:3,hitze:3}]]},
 {id:"schutz", t:"Benutzt du vor der Hitze einen Hitzeschutz?", if:()=>val("hitze").hitze>0, a:[
  ["Immer",{}],["Manchmal",{d:1,hz:1,ohne:1}],["Nie",{d:2,hz:2,ohne:2}]]},
 {id:"temp", t:"Wie heiß stellst du dein Gerät ein?", if:()=>val("hitze").hitze>0, a:[
  ["Bis 180 °C",{}],["Bis 200 °C",{hz:1}],["Über 200 °C",{d:1,hz:2,heiss:1}],["Weiß ich nicht",{hz:1,tunb:1}]]},
 {id:"reib", multi:1, t:"Was davon passiert bei dir öfter?", h:"Du kannst mehreres auswählen.", a:[
  ["Ich schlafe mit offenen Haaren auf einem Baumwollkissen",{reib:2,kissen:1}],["Ich rubble meine nassen Haare mit dem Handtuch trocken",{reib:2,rubbeln:1}],["Ich bürste meine Haare, wenn sie nass sind",{reib:1,nass:1}],["Ich trage straffe Zöpfe oder Gummis mit Metall",{zug:2,zopf:1}],["Rucksack, Schal oder Kragen reiben an meinen Haaren",{reib:1,kragen:1}],["Ich mache Sport mit offenen Haaren",{reib:1,sport:1}],["Ich spiele oft mit meinen Haaren oder zwirble sie",{reib:1,spiel:1}],["Nichts davon",{x:1}]]},
 {id:"pflege", t:"Wie oft benutzt du nach der Haarwäsche Conditioner oder eine Maske?", a:[
  ["Nach jeder Haarwäsche",{}],["Nach etwa jeder zweiten Haarwäsche",{pf:2,halb:1}],["Selten oder nie",{d:1,pf:3,nie:1}]]},
 {id:"leavein", t:"Und wie sieht es mit Leave-in aus?", a:[
  ["Täglich, auch ins trockene Haar",{li:2}],["Nur nach dem Waschen",{li:1,pf:1}],["Selten oder nie",{li:0,pf:2}]]},
 {id:"umwelt", t:"Sind deine Haare oft Sonne, Chlor oder Salzwasser ausgesetzt?", a:[
  ["Selten",{}],["Im Sommer oft",{um:1}],["Das ganze Jahr über",{d:1,um:2}]]}
];
const FINE = "Ich bin keine Friseurin und keine Ärztin, und ich kann deine Haare hier nicht sehen. Dein Ergebnis ist deshalb eine Einschätzung aus deinen Antworten. Der Check ersetzt keinen Blick von einem Profi, er hilft dir aber, deine Haare besser einzuschätzen. Wenn deine Haare plötzlich stark ausfallen oder abbrechen, lass das bitte ärztlich abklären.";
const SPL = {
 y:["Y-Spliss","Der klassische Spliss: Die Spitze hat sich in zwei Teile gespalten. Er entsteht, wenn die äußere Schuppenschicht an den ältesten Haarenden abgenutzt ist."],
 baum:["Baum-Spliss","Die Spitze hat sich mehrfach verzweigt. Das ist fortgeschrittener Spliss, der weiter nach oben wandert, wenn er nicht abgeschnitten wird."],
 punkt:["Weißer Punkt","Der weiße Punkt sitzt immer an der Haarspitze. Hier ist das Haar innen schon so geschwächt, dass es noch nicht gespalten ist, aber an dieser Stelle bald abbricht."],
 loch:["Loch in der Länge","Das Haar ist mitten in der Länge gespalten und hält nur oben und unten noch zusammen. Das zeigt, dass das Haar nicht nur an den Spitzen, sondern auch in den Längen geschädigt ist, oft durch Hitze oder chemische Behandlungen."],
 frans:["Ausgefranste, dünne Spitzen","Die Spitzen sind über die Zeit abgenutzt und dünner geworden, meist durch Reibung. Sie verknoten leichter und brechen schneller."],
 knoten:["Knötchen","Einzelne Haare haben sich verknotet, das passiert vor allem bei Reibung und bei rauem Haar. Am Knoten bricht das Haar leicht ab."]
};

/* ---------- Ablauf ---------- */
const app = document.getElementById("app");
let ans = {}, pos = 0;
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const reduce = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const visible = () => QS.filter(q => !q.if || q.if());
const sel = id => { const q = QS.find(x=>x.id===id), s = ans[id]; if(s==null) return []; return (Array.isArray(s)?s:[s]).map(i => q.a[i][1]); };
const val = id => sel(id)[0] || {};
const splissDa = () => sel("spliss").some(x => x.s);
const startArt = `<svg class="strand" viewBox="0 0 300 420" fill="none" aria-hidden="true">
  <path d="${(()=>{let d="M255 0";for(let y=0;y<=330;y+=4){d+=" L"+(255-y*0.45+10*Math.sin(y/22)).toFixed(1)+" "+y;}return d+" L95 370 M107 330 L120 372";})()}" stroke="#F3ECE2" stroke-width="1"/>
  <path d="${(()=>{let d="M285 0";for(let y=0;y<=420;y+=2){d+=" L"+(285-y*0.45+14*Math.sin(y/9)).toFixed(1)+" "+y;}return d;})()}" stroke="#9E8C80" stroke-width="1"/></svg>`;
function start(){
  ans = {}; pos = 0;
  app.innerHTML = `<section class="start fade">${startArt}
    <div class="by">Spliss- &amp; Bruch-Check · ein Quiz von Laura, deiner Haarpflege-Bestie</div>
    <h1>Wie kaputt sind deine Haare?</h1>
    <p class="lead">Wie geschädigt sind deine Haare gerade, welchen Spliss hast du, und woher kommt der Haarbruch: Reibung, Hitze oder chemische Behandlungen? Am Ende weißt du, was los ist und wie du damit umgehst.</p>
    <p class="how">Bis zu 15 kurze Fragen, ungefähr drei Minuten. Leg dir am besten einen Spiegel bereit.</p>
    <button class="primary" id="go">Quiz starten</button>
    <p class="fine">${FINE}</p>
  </section>`;
  document.getElementById("go").onclick = () => { pos = 0; render(); };
  window.scrollTo(0,0);
}
function render(){
  const V = visible(), q = V[pos], s = ans[q.id];
  const on = i => q.multi ? (Array.isArray(s) && s.includes(i)) : s === i;
  app.innerHTML = `<section class="q fade">
    <div class="top"><button class="ghost" id="back">Zurück</button><span class="count">Frage ${pos+1} von ${V.length}</span></div>
    <div class="bar"><span style="width:${(pos/V.length)*100}%"></span></div>
    <h2>${esc(q.t)}</h2>
    ${q.h ? `<p class="hint">${esc(q.h)}</p>` : ""}
    <div class="answers">${q.a.map((a,i)=>`<button class="ans${q.multi?" multi":""}${a[1].ico?" has-ico":""}" data-i="${i}" aria-pressed="${on(i)}"><span class="dot"></span>${a[1].ico?ico(a[1].ico):""}<span>${esc(a[0])}</span></button>`).join("")}</div>
    ${q.multi ? `<button class="primary next" id="next" ${Array.isArray(s)&&s.length?"":"disabled"}>Weiter</button>` : ""}
  </section>`;
  document.getElementById("back").onclick = () => { if(pos===0) start(); else { pos--; render(); } };
  app.querySelectorAll(".ans").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if(q.multi){
      let cur = Array.isArray(ans[q.id]) ? ans[q.id].slice() : [];
      if(q.a[i][1].x) cur = cur.includes(i) ? [] : [i];
      else { cur = cur.filter(k => !q.a[k][1].x); cur = cur.includes(i) ? cur.filter(k=>k!==i) : cur.concat(i); }
      ans[q.id] = cur;
      app.querySelectorAll(".ans").forEach(x => x.setAttribute("aria-pressed", cur.includes(+x.dataset.i)));
      document.getElementById("next").disabled = !cur.length;
    } else {
      ans[q.id] = i;
      app.querySelectorAll(".ans").forEach(x => x.setAttribute("aria-pressed", x===b));
      setTimeout(advance, reduce()?0:260);
    }
  });
  if(q.multi) document.getElementById("next").onclick = advance;
  window.scrollTo(0,0);
}
function advance(){ const V = visible(); if(pos < V.length-1){ pos++; render(); } else briefOeffnen(result); }

/* ---------- Auswertung ---------- */
function evaluate(){
  let d = 0; const c = {reib:0, hz:0, ch:0, pf:0, zug:0, um:0}, f = {};
  visible().forEach(q => sel(q.id).forEach(x => {
    if(x.d) d += x.d;
    Object.keys(c).forEach(k => { if(x[k]) c[k] += x[k]; });
    Object.keys(x).forEach(k => { if(!(k in c) && k!=="d" && k!=="ico") f[k] = x[k]; });
  }));
  const spl = sel("spliss").filter(x => x.s).map(x => x.s);
  /* Stufe: beansprucht, geschädigt, stark strukturgeschädigt */
  let lvl = d <= 5 ? 1 : d <= 11 ? 2 : 3;
  if(f.gummi && (f.blond || f.perm)) lvl = 3;
  /* Auch sehr viel Hitze oder starke Reibung kann das Haar bis in die Struktur schädigen (Laura) */
  if(f.gummi && (c.hz >= 4 || c.reib >= 5)) lvl = 3;
  if(f.gummi && lvl < 2) lvl = 2;
  if(lvl === 1 && (spl.includes("baum") || spl.includes("loch") || f.wo === "laengen")) lvl = 2;

    {k:"reib", s:c.reib}, {k:"hz", s:c.hz}, {k:"ch", s:c.ch}, {k:"pf", s:c.pf}, {k:"zug", s:c.zug}, {k:"um", s:c.um*1.5}
  ].filter(x => x.s >= (x.k === "pf" ? 3 : 2)).sort((a,b) => b.s - a.s).slice(0, 3).map(x => x.k);
  return {d, lvl, c, f, spl, causes};
}
const LVL = {

  try { await navigator.clipboard.writeText(t); ok = true; } catch(e){}

}

  animation:brfHoch 1s cubic-bezier(.2,.75,.25,1) .1s both}

.brf .karte img{display:block;width:100%;height:auto}
.brf .karte .txt{position:absolute;left:0;right:0;top:3.5%;text-align:center;color:#382F2E;font-family:"LH Brief Serif",var(--serif,Georgia,serif);font-weight:400;

.brf .tipp{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));right:16px;font:13px/1.4 var(--sans,sans-serif);color:rgba(243,236,226,.5);letter-spacing:.04em;z-index:5}
.brf.zoom .buehne{animation:brfZoom .75s cubic-bezier(.4,0,.2,1) both}
@keyframes brfIn{from{opacity:0}to{opacity:1}}
@keyframes brfOut{from{opacity:1}to{opacity:0}}
