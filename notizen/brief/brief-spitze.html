<!-- BRIEF START: Brief-Animation vor dem Quiz-Ergebnis (Quelle: notizen/brief/brief.html, eingebaut mit notizen/brief/einbauen.py) -->
<style>
/* Offener Spitzen-Umschlag aus Lauras Foto (22.10.): Hand mit Umschlag schiebt sich von unten ins Bild,
   groß im Bild (Laura 22.10.), dann Überblendung zum Ergebnis. Ebenen aus notizen/brief/umschlag_offen.py */
@font-face{font-family:"LH Brief Serif";font-style:normal;font-weight:400;src:url(__F_NORMAL__) format("woff2")}
@font-face{font-family:"LH Brief Serif";font-style:italic;font-weight:400;src:url(__F_ITALIC__) format("woff2")}
.brf{position:fixed;inset:0;z-index:9999;cursor:pointer;overflow:hidden;
  background:radial-gradient(70% 60% at 50% 48%,#433938 0%,#382F2E 60%,#2c2524 100%);animation:brfIn .3s ease both}
.brf.weg{animation:brfOut .7s ease both}
.brf .buehne{--h:min(118%,185vw);position:absolute;left:50%;height:var(--h);bottom:min(0px,calc(98% - var(--h)));aspect-ratio:900/1440;transform:translateX(-50%);container-type:inline-size;
  animation:brfHoch 1s cubic-bezier(.2,.75,.25,1) .1s both}
.brf .eb{position:absolute;display:block;pointer-events:none;user-select:none;height:auto}
.brf .hinten{left:__M_hinten_l__%;top:__M_hinten_t__%;width:__M_hinten_w__%;z-index:1;filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
.brf .karte{position:absolute;left:__M_karte_l__%;top:__M_karte_t__%;width:__M_karte_w__%;z-index:2;transform:translateY(-14%)}
.brf .karte img{display:block;width:100%;height:auto}
.brf .karte .txt{position:absolute;left:0;right:0;top:6.5%;text-align:center;color:#382F2E;font-family:"LH Brief Serif",var(--serif,Georgia,serif);font-weight:400;
  font-size:11.6cqw;line-height:.86;text-transform:uppercase;letter-spacing:0}
.brf .karte .txt em{display:block;font-style:italic;text-transform:none;font-size:1.4em}
.brf .vorne{left:__M_vorne_l__%;top:__M_vorne_t__%;width:__M_vorne_w__%;z-index:3}
.brf .tipp{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));right:16px;font:13px/1.4 var(--sans,sans-serif);color:rgba(243,236,226,.5);letter-spacing:.04em;z-index:5}
.brf.zoom .buehne{animation:brfZoom .75s cubic-bezier(.4,0,.2,1) both}
@keyframes brfIn{from{opacity:0}to{opacity:1}}
@keyframes brfOut{from{opacity:1}to{opacity:0}}
@keyframes brfHoch{from{transform:translate(-50%,75%)}to{transform:translate(-50%,0)}}
@keyframes brfZoom{from{transform:translate(-50%,0)}to{transform:translate(-50%,6%) scale(1.18);opacity:0}}
@media (prefers-reduced-motion:reduce){ .brf{display:none} }
</style>
<script>
/* Brief öffnen: offener Umschlag mit Karte kommt von unten, dann Überblendung zum Ergebnis.
   fertig() baut das Ergebnis darunter. Tippen überspringt. */
window.briefOeffnen = function(fertig){
  if(document.querySelector(".brf")) return;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ fertig(); return; }
  const o = document.createElement("div");
  o.className = "brf"; o.setAttribute("role","status"); o.setAttribute("aria-label","Dein Ergebnis wird geöffnet");
  o.innerHTML = `<div class="buehne">
      <img class="eb hinten" src="__U_HINTEN__" alt="">
      <div class="karte"><img src="__U_KARTE__" alt=""><div class="txt"><em>Dein</em> Ergebnis</div></div>
      <img class="eb vorne" src="__U_VORNE__" alt="">
    </div>
    <div class="tipp">Tippen zum Überspringen</div>`;
  document.body.appendChild(o);
  let done = false;
  const ende = () => {
    if(done) return; done = true;
    fertig();
    o.classList.add("zoom");
    setTimeout(() => o.classList.add("weg"), 120);
    setTimeout(() => o.remove(), 850);
  };
  const t = setTimeout(ende, 2600);
  o.addEventListener("click", () => { clearTimeout(t); ende(); });
};
</script>
<!-- BRIEF END -->
