<script>
(function(){
  const root = document.documentElement;
  root.setAttribute("data-look", "b");
  window.KAUF_DEMO = true; /* zeigt den Platz für „Jetzt kaufen“ */
  /* Signatur-Strähnen neben dem Namen */
  const logo = document.querySelector(".logo");
  if(logo && !logo.querySelector(".strands")){
    logo.innerHTML = `<svg class="strands" viewBox="0 0 30 60" fill="none" aria-hidden="true"><path d="M11 2 C 6 18, 16 33, 10 58" stroke="#382F2E" stroke-width="1.2"/><path d="M21 2 C 16 18, 26 33, 20 58" stroke="#9E8C80" stroke-width="1.2"/></svg><span class="txt2">${logo.innerHTML}</span>`;
  }
  /* Stil und Schrift stehen fest (Laura hat sich entschieden): Rouje-Stil + Instrument.
     Die alte Auswahlleiste liegt in der Git-Historie. */
  const banner = document.querySelector(".note-banner");
  if(banner) banner.remove();
  root.setAttribute("data-stil", "rouje");
  root.setAttribute("data-font", "instrument");
})();
</script>
