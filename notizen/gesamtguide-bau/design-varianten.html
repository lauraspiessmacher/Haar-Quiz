<!-- Design „Hell & leicht“ (Variante B) mit Schrift-Auswahl. Wird von build-vorschau.py nur in die Design-Vorschau eingesetzt.
     Schriften: alle unter SIL Open Font License, direkt in die Seite eingebaut (keine Verbindung zu Google beim Besuch). -->
<style>
/*FONTS*/
html[data-look]{
  --espresso:#382F2E; --cream:#F3ECE2; --sand:#D6B98F; --mocha:#C9BCAE;
  --sans:"LH Jost","Avenir Next",Avenir,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"LH Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --hw:500; /* Gewicht der Überschriften */
}
html[data-font="bodoni"]{--serif:"LH Bodoni Moda","Didot","Bodoni 72",Georgia,serif}
html[data-font="playfair"]{--serif:"LH Playfair Display",Georgia,serif}
html[data-font="italiana"]{--serif:"LH Italiana","Didot",Georgia,serif;--hw:400}
html[data-font="gilda"]{--serif:"LH Gilda Display","Didot",Georgia,serif;--hw:400}
html[data-font="instrument"]{--serif:"LH Instrument Serif","Didot",Georgia,serif;--hw:400}
html[data-font="caslon"]{--serif:"LH Libre Caslon Condensed",Georgia,serif;--hw:400}

html[data-look="b"]:not([data-theme="zz"]){--bg:#F7F2EA !important;--paper:#FCFAF6 !important;--card:#EFE7DC !important}
html[data-look="b"] body{background:#F7F2EA !important;letter-spacing:.005em}
html[data-look] h1,html[data-look] h2,html[data-look] h3,html[data-look] .name,html[data-look] .logo b{font-weight:var(--hw);text-wrap:balance}
html[data-look] .logo b{font-size:21px;letter-spacing:.12em;text-transform:uppercase;font-style:normal;color:var(--espresso)}
html[data-look] .name{font-size:22px;line-height:1.15}
html[data-look] .ghead h2{font-size:clamp(36px,5vw,52px);font-style:italic}
html[data-look] h3.sec{font-size:30px}

/* Kopfzeile: hell, feine Linie, Menü in Großbuchstaben */
html[data-look="b"] header.top{background:rgba(247,242,234,.97);border-bottom:1px solid rgba(56,47,46,.10)}
html[data-look="b"] nav.main button{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
html[data-look="b"] nav.main button[aria-current="page"]{background:var(--espresso);color:var(--cream)}
html[data-look="b"] nav.main button.me{background:#7A6A65;border-color:#7A6A65;color:var(--cream)}
html[data-look="b"] nav.main button.me:hover{background:#6B5C57}
html[data-look="b"] nav.main button.me[data-set="1"]::after{background:var(--cream)}
html[data-look="b"] .ptab{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;border-bottom-width:1px}
html[data-look="b"] .ptab[aria-current="true"]{font-weight:500;border-bottom:1px solid var(--espresso)}
html[data-look="b"] .ptab .n{letter-spacing:0}
/* Signatur: zwei Haarsträhnen neben dem Namen, wie in deinen Guides */
html[data-look] .logo{flex-direction:row;align-items:center;gap:12px}
html[data-look] .logo .strands{width:22px;height:42px;flex:0 0 auto}
html[data-look] .logo .txt2{display:flex;flex-direction:column}

/* Produkte: feine Linien statt Kästen */
html[data-look="b"] .brand{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase}
html[data-look="b"] .item{background:#FCFAF6;border:1px solid rgba(56,47,46,.30);border-radius:14px;padding:16px 16px 14px;transition:box-shadow .2s ease, transform .2s ease}
html[data-look="b"] .item:hover{box-shadow:0 10px 26px -16px rgba(56,47,46,.45);transform:translateY(-2px)}
html[data-look="b"] .grid{gap:16px}
html[data-look="b"] .chip{border-color:rgba(56,47,46,.18);font-size:13.5px}
html[data-look="b"] .tip{background:rgba(56,47,46,.05);border-radius:8px;padding:6px 10px}
html[data-look="b"] .ghead{border-top:0}
html[data-look="b"] .ghead h2::after{content:"";display:block;width:48px;height:1px;background:var(--espresso);margin-top:12px}
/* Erklärtext: leicht in deinem Braun hinterlegt */
html[data-look="b"] .gintro{background:rgba(56,47,46,.055);border-color:rgba(56,47,46,.14)}

/* Sanftes Einblenden */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
html[data-look] .grid .item{animation:rise .45s ease both}
html[data-look] .grid .item:nth-child(2){animation-delay:.04s}
html[data-look] .grid .item:nth-child(3){animation-delay:.08s}
html[data-look] .grid .item:nth-child(4){animation-delay:.12s}
html[data-look] .grid .item:nth-child(5){animation-delay:.16s}
html[data-look] .grid .item:nth-child(6){animation-delay:.2s}
html[data-look] .grid .item:nth-child(n+7){animation-delay:.24s}
@media (prefers-reduced-motion:reduce){ html[data-look] .grid .item{animation:none} }
@media (max-width:759px){
  html[data-look="b"] nav.main button{font-size:11.5px;letter-spacing:.06em}
  html[data-look="b"] .ptab{font-size:11.5px;letter-spacing:.08em}
  html[data-look] .logo .strands{height:34px}
  html[data-look] .logo b{font-size:16px;letter-spacing:.08em}
}

/* ===== Rouje-Stil: viel Luft, große schmale Überschriften in Großbuchstaben, schlichte Grotesk ===== */
html[data-stil="rouje"]{--sans:"LH Instrument Sans","Helvetica Neue",Arial,sans-serif}
html[data-stil="rouje"]:not([data-theme="zz"]){--bg:#FBF7F3 !important;--paper:#FFFDFA !important;--card:#F3EEE9 !important}
html[data-stil="rouje"] body{background:#FBF7F3 !important;letter-spacing:0}
html[data-stil="rouje"] header.top{background:rgba(251,247,243,.97)}
html[data-stil="rouje"] .logo b{font-size:25px;letter-spacing:.05em}
html[data-stil="rouje"] .logo span{font-family:var(--sans);font-style:normal;font-size:13.5px;color:#7A6A65;letter-spacing:.03em;margin-top:3px}
html[data-stil="rouje"] nav.main button,html[data-stil="rouje"] .ptab{font-size:11.5px;letter-spacing:.12em}
@media (min-width:760px){ html[data-stil="rouje"] .ptab{padding-left:10px;padding-right:10px} }
/* 9 Produktarten (mit Haarbürsten und Hitze-Tools): auf Laptops kompakter, Anzahl ausblenden */
@media (min-width:760px){ html[data-stil="rouje"] .ptab{padding-left:7px;padding-right:7px;letter-spacing:.07em;gap:5px} html[data-stil="rouje"] .ptab .n{display:none} }
@media (min-width:760px) and (max-width:1199px){ html[data-stil="rouje"] nav.sub .in{flex-wrap:wrap;justify-content:center} }
/* Große Überschrift wie „KAPSEL ROSE“ */
html[data-stil="rouje"] .ghead h2{font-style:normal;text-transform:uppercase;font-size:clamp(52px,8.5vw,112px);line-height:.92;letter-spacing:-.005em}
html[data-stil="rouje"] .ghead h2::after{display:none}
html[data-stil="rouje"] .ghero .ghead h2{font-size:clamp(48px,6.6vw,84px)}
html[data-stil="rouje"] .ghead .sub{font-family:var(--serif);font-style:italic;font-size:19px;color:#7A6A65;margin-top:10px}
html[data-stil="rouje"] h3.sec{text-transform:uppercase;font-size:34px;letter-spacing:.01em}
html[data-stil="rouje"] h1{text-transform:uppercase}
html[data-stil="rouje"] .intro h1{font-size:clamp(52px,8.5vw,112px);line-height:.92;margin-bottom:14px}
/* Erklärtext: ruhiger Block mit eckigen Kanten */
html[data-stil="rouje"] .gintro{border-radius:4px;border:0;background:#F1EBE6;padding:12px 16px 6px}
/* Produkte: Bild groß auf hellem Feld, darunter der Text, dünner dunkelbrauner Rahmen */
html[data-stil="rouje"] .item{flex-direction:column;gap:14px;border-radius:6px;padding:10px 10px 16px;background:#FFFDFA}
html[data-stil="rouje"] .item .pic{order:0;width:100%;height:190px;padding:20px 0;box-sizing:border-box;background:#F1ECE7;border-radius:3px;object-fit:contain}
html[data-stil="rouje"] .item .txt{padding:0 6px}
html[data-stil="rouje"] .item .name{font-size:24px}
html[data-stil="rouje"] .grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
html[data-stil="rouje"] .tip{border-radius:3px}
/* Knöpfe eckiger, wie bei Rouje */
html[data-stil="rouje"] nav.main button,html[data-stil="rouje"] .qgo{border-radius:4px}
html[data-stil="rouje"] .qcard{border-radius:6px}
html[data-stil="rouje"] .qcard h3,html[data-stil="rouje"] .qcard h2{text-transform:uppercase}
html[data-stil="rouje"] .qgo{text-transform:uppercase;letter-spacing:.12em;font-size:12px;padding:11px 18px}
@media (max-width:520px){
  html[data-stil="rouje"] .item{flex-direction:row;padding:10px}
  html[data-stil="rouje"] .item .pic{order:2;width:92px;height:132px;padding:10px 0}
  html[data-stil="rouje"] .item .txt{padding:0}
  html[data-stil="rouje"] .item .name{font-size:22px}
  /* Hitze-Tools: Übersichtsbild mit allen Aufsätzen auch am Handy groß oben */
  html[data-stil="rouje"] .item.tool{flex-direction:column}
  html[data-stil="rouje"] .item.tool .pic{order:0;width:100%;height:170px;padding:14px 0}
  html[data-stil="rouje"] .logo b{font-size:17px;letter-spacing:.04em}
  html[data-stil="rouje"] .logo span{font-size:12.5px}
}
/* Startseite im Rouje-Stil */
html[data-stil="rouje"] .hero h1{font-size:clamp(42px,6.2vw,80px);line-height:.92}
html[data-stil="rouje"] .btn{border-radius:4px;text-transform:uppercase;letter-spacing:.12em;font-size:12px;padding:12px 18px}
html[data-stil="rouje"] .promise{border-radius:6px}
html[data-stil="rouje"] .promise h2,html[data-stil="rouje"] .routine h2,html[data-stil="rouje"] .offer h3{text-transform:uppercase}
html[data-stil="rouje"] .routine h2{font-size:clamp(40px,6vw,72px)}
html[data-stil="rouje"] .offer button{border-radius:6px;background:#FFFDFA}
html[data-stil="rouje"] .offer h3{font-size:28px}
html[data-stil="rouje"] .photo{background:#F1ECE7}
html[data-stil="rouje"] .reel{border-radius:6px}
html[data-stil="rouje"] .buy{border-radius:4px;text-transform:uppercase;letter-spacing:.1em;font-size:11px;padding:8px 12px}
html[data-stil="rouje"] .mitem{border-radius:6px;background:#FFFDFA}
html[data-stil="rouje"] .mcol h3{text-transform:uppercase;font-size:28px}
html[data-stil="rouje"] .mitem .mpic{border-radius:3px}
@media (min-width:521px){ html[data-stil="rouje"] .item .row{padding-right:0} html[data-stil="rouje"] .save{top:18px;right:18px} }
html[data-stil="rouje"] .journey h2{text-transform:uppercase;font-size:clamp(40px,5.5vw,64px)}
html[data-stil="rouje"] .serie h2{text-transform:uppercase;font-size:clamp(40px,6vw,72px)}
.looktop .sep{flex-basis:100%;height:0}
.looktop button[data-font="instrument"]{font-family:"LH Instrument Serif",serif}
.looktop button[data-font="caslon"]{font-family:"LH Libre Caslon Condensed",serif}
.looktop button[data-stil]{font-family:var(--sans);font-size:13px;letter-spacing:.08em;text-transform:uppercase}

/* Schrift-Auswahl oben */
.looktop{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px dashed rgba(56,47,46,.25);border-radius:12px;padding:10px 12px;margin:16px 0 0;font-size:14px}
.looktop b{font-weight:500;margin-right:4px}
.looktop button{border:1px solid rgba(56,47,46,.2);background:#FCFAF6;color:#382F2E;border-radius:999px;padding:5px 14px;cursor:pointer;font-size:17px;line-height:1.3}
.looktop button[aria-pressed="true"],.looktop button[data-on="1"]{background:#382F2E;color:#F3ECE2;border-color:#382F2E}
.looktop button[data-font="cormorant"]{font-family:"LH Cormorant Garamond",serif;font-weight:500}
.looktop button[data-font="bodoni"]{font-family:"LH Bodoni Moda",serif;font-weight:500}
.looktop button[data-font="playfair"]{font-family:"LH Playfair Display",serif;font-weight:500}
.looktop button[data-font="italiana"]{font-family:"LH Italiana",serif}
.looktop button[data-font="gilda"]{font-family:"LH Gilda Display",serif}
</style>
