<!-- Design „Hell & leicht“ (Variante B) mit Schrift-Auswahl. Wird von build-vorschau.py nur in die Design-Vorschau eingesetzt.
     Schriften: alle unter SIL Open Font License, direkt in die Seite eingebaut (keine Verbindung zu Google beim Besuch). -->
<style>
/*FONTS*/
html[data-look]{
  --espresso:#382F2E; --cream:#F3ECE2; --sand:#D6B98F; --mocha:#C9BCAE;
  --sans:"LH Jost","Avenir Next",Avenir,"Segoe UI",Roboto,Arial,sans-serif;
  --serif:"LH Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --hw:500; /* Gewicht der Überschriften */
}
html[data-font="bodoni"]{--serif:"LH Bodoni Moda","Didot","Bodoni 72",Georgia,serif}
html[data-font="playfair"]{--serif:"LH Playfair Display",Georgia,serif}
html[data-font="italiana"]{--serif:"LH Italiana","Didot",Georgia,serif;--hw:400}
html[data-font="gilda"]{--serif:"LH Gilda Display","Didot",Georgia,serif;--hw:400}

html[data-look="b"]:not([data-theme="zz"]){--bg:#F7F2EA !important;--paper:#FCFAF6 !important;--card:#EFE7DC !important}
html[data-look="b"] body{background:#F7F2EA !important;letter-spacing:.005em}
html[data-look] h1,html[data-look] h2,html[data-look] h3,html[data-look] .name,html[data-look] .logo b{font-weight:var(--hw);text-wrap:balance}
html[data-look] .logo b{font-size:21px;letter-spacing:.12em;text-transform:uppercase;font-style:normal;color:var(--espresso)}
html[data-look] .name{font-size:22px;line-height:1.15}
html[data-look] .ghead h2{font-size:clamp(36px,5vw,52px);font-style:italic}
html[data-look] h3.sec{font-size:30px}

/* Kopfzeile: hell, feine Linie, Menü in Großbuchstaben */
html[data-look="b"] header.top{background:rgba(247,242,234,.97);border-bottom:1px solid rgba(56,47,46,.10)}
html[data-look="b"] nav.main button{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
html[data-look="b"] nav.main button[aria-current="page"]{background:var(--espresso);color:var(--cream)}
html[data-look="b"] nav.main button.me{background:#7A6A65;border-color:#7A6A65;color:var(--cream)}
html[data-look="b"] nav.main button.me:hover{background:#6B5C57}
html[data-look="b"] nav.main button.me[data-set="1"]::after{background:var(--cream)}
html[data-look="b"] .ptab{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;border-bottom-width:1px}
html[data-look="b"] .ptab[aria-current="true"]{font-weight:500;border-bottom:1px solid var(--espresso)}
html[data-look="b"] .ptab .n{letter-spacing:0}
/* Signatur: zwei Haarsträhnen neben dem Namen, wie in deinen Guides */
html[data-look] .logo{flex-direction:row;align-items:center;gap:12px}
html[data-look] .logo .strands{width:22px;height:42px;flex:0 0 auto}
html[data-look] .logo .txt2{display:flex;flex-direction:column}

/* Produkte: feine Linien statt Kästen */
html[data-look="b"] .brand{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase}
html[data-look="b"] .item{background:#FCFAF6;border:1px solid rgba(56,47,46,.30);border-radius:14px;padding:16px 16px 14px;transition:box-shadow .2s ease, transform .2s ease}
html[data-look="b"] .item:hover{box-shadow:0 10px 26px -16px rgba(56,47,46,.45);transform:translateY(-2px)}
html[data-look="b"] .grid{gap:16px}
html[data-look="b"] .chip{border-color:rgba(56,47,46,.18);font-size:13.5px}
html[data-look="b"] .tip{background:rgba(56,47,46,.05);border-radius:8px;padding:6px 10px}
html[data-look="b"] .ghead{border-top:0}
html[data-look="b"] .ghead h2::after{content:"";display:block;width:48px;height:1px;background:var(--espresso);margin-top:12px}
/* Erklärtext: leicht in deinem Braun hinterlegt */
html[data-look="b"] .gintro{background:rgba(56,47,46,.055);border-color:rgba(56,47,46,.14)}

/* Sanftes Einblenden */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
html[data-look] .grid .item{animation:rise .45s ease both}
html[data-look] .grid .item:nth-child(2){animation-delay:.04s}
html[data-look] .grid .item:nth-child(3){animation-delay:.08s}
html[data-look] .grid .item:nth-child(4){animation-delay:.12s}
html[data-look] .grid .item:nth-child(5){animation-delay:.16s}
html[data-look] .grid .item:nth-child(6){animation-delay:.2s}
html[data-look] .grid .item:nth-child(n+7){animation-delay:.24s}
@media (prefers-reduced-motion:reduce){ html[data-look] .grid .item{animation:none} }
@media (max-width:759px){
  html[data-look="b"] nav.main button{font-size:11.5px;letter-spacing:.06em}
  html[data-look="b"] .ptab{font-size:11.5px;letter-spacing:.08em}
  html[data-look] .logo .strands{height:34px}
  html[data-look] .logo b{font-size:16px;letter-spacing:.08em}
}

/* Schrift-Auswahl oben */
.looktop{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px dashed rgba(56,47,46,.25);border-radius:12px;padding:10px 12px;margin:16px 0 0;font-size:14px}
.looktop b{font-weight:500;margin-right:4px}
.looktop button{border:1px solid rgba(56,47,46,.2);background:#FCFAF6;color:#382F2E;border-radius:999px;padding:5px 14px;cursor:pointer;font-size:17px;line-height:1.3}
.looktop button[aria-pressed="true"]{background:#382F2E;color:#F3ECE2;border-color:#382F2E}
.looktop button[data-font="cormorant"]{font-family:"LH Cormorant Garamond",serif;font-weight:500}
.looktop button[data-font="bodoni"]{font-family:"LH Bodoni Moda",serif;font-weight:500}
.looktop button[data-font="playfair"]{font-family:"LH Playfair Display",serif;font-weight:500}
.looktop button[data-font="italiana"]{font-family:"LH Italiana",serif}
.looktop button[data-font="gilda"]{font-family:"LH Gilda Display",serif}
</style>
