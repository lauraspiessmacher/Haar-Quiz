<!-- Design-Varianten für die Gesamtseite. Wird von build-vorschau.py nur in die Design-Vorschau eingesetzt. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap">
<style>
/* Gemeinsam für alle drei Varianten: elegantere Schrift, sanfte Bewegung */
html[data-look]{
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Jost","Avenir Next",Avenir,"Segoe UI",Roboto,Arial,sans-serif;
  --espresso:#382F2E;      /* Lauras kühles Dunkelbraun */
  --espresso-2:#433836;
  --cream:#F3ECE2;
  --sand:#D6B98F;          /* zarter Akzent wie in den Quiz */
  --mocha:#C9BCAE;
}
html[data-look] body{letter-spacing:.005em}
html[data-look] h1,html[data-look] h2,html[data-look] h3{font-weight:500;letter-spacing:.005em;text-wrap:balance}
html[data-look] .logo b{font-size:27px;font-weight:600;letter-spacing:.01em}
html[data-look] .name{font-size:22px;font-weight:600;line-height:1.15}
html[data-look] .ghead h2{font-size:clamp(34px,5vw,48px)}
html[data-look] h3.sec{font-size:30px}
html[data-look] .item{transition:transform .2s ease, box-shadow .2s ease}
html[data-look] .item:hover{transform:translateY(-2px)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
html[data-look] .grid .item{animation:rise .45s ease both}
html[data-look] .grid .item:nth-child(2){animation-delay:.04s}
html[data-look] .grid .item:nth-child(3){animation-delay:.08s}
html[data-look] .grid .item:nth-child(4){animation-delay:.12s}
html[data-look] .grid .item:nth-child(5){animation-delay:.16s}
html[data-look] .grid .item:nth-child(6){animation-delay:.2s}
html[data-look] .grid .item:nth-child(n+7){animation-delay:.24s}
@media (prefers-reduced-motion:reduce){ html[data-look] .grid .item{animation:none} html[data-look] .item:hover{transform:none} }

/* ---------- A: Espresso-Kopf (Kopfzeile in deinem Dunkelbraun, Inhalt hell) ---------- */
html[data-look="a"] header.top{background:var(--espresso);border-bottom:0;backdrop-filter:none}
html[data-look="a"] .logo b{color:var(--cream)}
html[data-look="a"] .logo span{color:var(--mocha)}
html[data-look="a"] nav.main button{color:var(--cream)}
html[data-look="a"] nav.main button:hover{background:rgba(243,236,226,.10)}
html[data-look="a"] nav.main button[aria-current="page"]{background:var(--cream);color:var(--espresso)}
html[data-look="a"] nav.main button.me{border-color:rgba(243,236,226,.35);background:transparent}
html[data-look="a"] nav.sub{border-top:1px solid rgba(243,236,226,.14)}
html[data-look="a"] .ptab{color:var(--mocha)}
html[data-look="a"] .ptab .n{color:rgba(201,188,174,.7)}
html[data-look="a"] .ptab:hover{background:rgba(243,236,226,.06);color:var(--cream)}
html[data-look="a"] .ptab[aria-current="true"]{color:var(--cream);border-bottom-color:var(--sand);font-weight:500}
html[data-look="a"] .item{background:#FBF8F3;border-color:transparent;box-shadow:0 1px 2px rgba(56,47,46,.05),0 10px 28px -18px rgba(56,47,46,.35)}
html[data-look="a"] .item:hover{box-shadow:0 1px 2px rgba(56,47,46,.06),0 16px 34px -18px rgba(56,47,46,.45)}
html[data-look="a"] .ghead{border-top:0}
html[data-look="a"] .ghead h2::after{content:"";display:block;width:56px;height:2px;background:var(--sand);margin-top:10px}
@media (max-width:759px){ html[data-look="a"] nav.main button.me{background:rgba(243,236,226,.08);border-color:transparent} }

/* ---------- B: Hell & leicht (viel Luft, feine Linien, Braun nur als Akzent) ---------- */
html[data-look="b"]:not([data-theme="zz"]){--bg:#F7F2EA !important;--paper:#FCFAF6 !important;--card:#EFE7DC !important}
html[data-look="b"] body{background:#F7F2EA !important}
html[data-look="b"] header.top{background:rgba(247,242,234,.97);border-bottom:1px solid rgba(56,47,46,.10)}
html[data-look="b"] nav.main button{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
html[data-look="b"] nav.main button[aria-current="page"]{background:var(--espresso);color:var(--cream)}
html[data-look="b"] .ptab{font-size:13px;letter-spacing:.14em;text-transform:uppercase;border-bottom-width:1px}
html[data-look="b"] .ptab[aria-current="true"]{font-weight:500;border-bottom:1px solid var(--espresso)}
html[data-look="b"] .ptab .n{letter-spacing:0}
html[data-look="b"] .brand{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase}
html[data-look="b"] .item{background:transparent;border:0;border-top:1px solid rgba(56,47,46,.16);border-radius:0;padding:18px 4px 14px}
html[data-look="b"] .item:hover{transform:none;background:rgba(255,255,255,.45)}
html[data-look="b"] .grid{gap:0 32px}
html[data-look="b"] .chip{border-color:rgba(56,47,46,.18);font-size:13.5px}
html[data-look="b"] .tip{background:transparent;border-left:2px solid var(--sand);border-radius:0;padding:4px 0 4px 10px}
html[data-look="b"] .ghead{border-top:0}
html[data-look="b"] .ghead h2{font-style:italic}
@media (max-width:759px){
  html[data-look="b"] nav.main button{font-size:12px;letter-spacing:.06em}
  html[data-look="b"] .ptab{font-size:11.5px;letter-spacing:.08em}
}

/* ---------- C: Ganz in Braun (wie deine Quiz: dunkler Grund, helle Schrift) ---------- */
html[data-look="c"]:not([data-theme="zz"]){--bg:#382F2E !important;--paper:#433836 !important;--card:#4C403C !important;--ink:#F3ECE2 !important;--muted:#C9BCAE !important;--line:rgba(243,236,226,.30) !important;--line-soft:rgba(243,236,226,.14) !important}
html[data-look="c"] body{background:#382F2E !important;color:#F3ECE2 !important}
html[data-look="c"] header.top{background:rgba(56,47,46,.97)}
html[data-look="c"] nav.main button[aria-current="page"],
html[data-look="c"] .chip[aria-pressed="true"],
html[data-look="c"] .switch button[aria-pressed="true"],
html[data-look="c"] .opt[aria-pressed="true"],
html[data-look="c"] .btn,html[data-look="c"] .card .go{background:var(--cream);color:var(--espresso);border-color:var(--cream)}
html[data-look="c"] .ptab[aria-current="true"]{border-bottom-color:var(--sand)}
html[data-look="c"] .item{border-color:transparent}
html[data-look="c"] .tag{background:#5A4C47;color:var(--cream)}
html[data-look="c"] .pic{filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
html[data-look="c"] .tip{background:#54463F}
html[data-look="c"] dialog{background:var(--bg);color:var(--ink)}
html[data-look="c"] .note-banner{border-color:rgba(243,236,226,.25)}
html[data-look="c"] :focus-visible{outline-color:var(--sand)}

/* Umschalter oben auf der Seite */
.looktop{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin:16px 0 0;font-size:14px}
.looktop b{font-weight:500;margin-right:4px}
.looktop button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit;font-size:14px}
.looktop button[aria-pressed="true"]{background:#382F2E;color:#F3ECE2;border-color:#382F2E}
html[data-look="c"] .looktop button[aria-pressed="true"]{background:#F3ECE2;color:#382F2E;border-color:#F3ECE2}
/* Umschalter für die Vorschau */
.lookswitch{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:4px;background:#382F2E;color:#F3ECE2;border-radius:999px;padding:5px 6px 5px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-family:"Jost",Arial,sans-serif;font-size:13px}
.lookswitch span{margin-right:4px;color:#C9BCAE}
.lookswitch button{border:0;background:transparent;color:#F3ECE2;border-radius:999px;padding:7px 12px;cursor:pointer;font:inherit}
.lookswitch button[aria-pressed="true"]{background:#F3ECE2;color:#382F2E}
@media (max-width:520px){ .lookswitch{left:16px;right:16px;justify-content:center} .lookswitch span{display:none} }
</style>
