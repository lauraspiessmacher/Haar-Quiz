<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hitze-Tool-Check</title>
<style>
:root{
  --bg:#382F2E;
  --surface:#433836;
  --cream:#F3ECE2;
  --muted:#C9BCAE;
  --line:rgba(243,236,226,.5);
  --line-soft:rgba(243,236,226,.18);
  --taupe:#9E8C80;
  --sand:#C9BCAE;
  --warn-bg:#4A3D35;
  --serif:"Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "Noto Serif", Georgia, serif;
  --sans:"Avenir Next", Avenir, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#382F2E; --cream:#F3ECE2; } }
:root[data-theme="dark"]{ --bg:#382F2E; --cream:#F3ECE2; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font-family:var(--sans);font-weight:400;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:28px 22px 48px}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.1}
p{margin:0 0 14px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sand);outline-offset:3px}

/* Start */
.start{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;position:relative}
.strand{position:absolute;top:0;right:-22px;width:62%;max-width:300px;opacity:.55;pointer-events:none}
.by{font-size:14px;color:var(--muted);margin-bottom:28px;letter-spacing:.02em}
.start h1{font-size:clamp(46px,13vw,68px);letter-spacing:-.01em;margin-bottom:22px;max-width:9ch}
.start .lead{font-size:18px;color:var(--cream);max-width:34ch}
.start .how{color:var(--muted);font-size:15px;max-width:38ch;margin-bottom:30px}
.primary{display:block;width:100%;padding:17px 20px;border:1px solid var(--cream);border-radius:999px;background:var(--cream);color:var(--bg);font-weight:500;font-size:17px;cursor:pointer}
.primary:active{transform:scale(.99)}
.ghost{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:4px}
.fine{font-size:13px;color:var(--muted);line-height:1.5;margin-top:26px;border-top:1px solid var(--line-soft);padding-top:16px}

/* Question */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;min-height:40px}
.count{font-size:14px;color:var(--muted)}
.bar{height:2px;background:var(--line-soft);border-radius:2px;overflow:hidden;margin-bottom:38px}
.bar span{display:block;height:100%;background:var(--cream);transition:width .35s ease}
.q h2{font-size:clamp(30px,8vw,38px);margin-bottom:12px}
.hint{color:var(--muted);font-size:15px;margin-bottom:22px}
.answers{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.ans{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:transparent;cursor:pointer;font-size:16.5px;line-height:1.4;transition:background .15s,border-color .15s,color .15s}
.ans .dot{flex:0 0 18px;height:18px;margin-top:2px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}
.ans.multi .dot{border-radius:5px}
.ans[aria-pressed="true"]{background:var(--cream);color:var(--bg);border-color:var(--cream)}
.ans[aria-pressed="true"] .dot{border-color:var(--bg);background:var(--bg)}
.ans[aria-pressed="true"] .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--cream)}
.ans.multi[aria-pressed="true"] .dot::after{border-radius:1px}
@media (hover:hover){.ans:hover{border-color:var(--cream)}}
.next{margin-top:26px}
.next[disabled]{opacity:.35;cursor:default}

/* Result */
.res-kicker{font-size:15px;color:var(--muted);margin-bottom:8px}
.res h1{font-size:clamp(44px,12vw,62px);margin-bottom:20px}
.res .intro{font-size:18px;margin-bottom:28px}
.block{border-top:1px solid var(--line-soft);padding:22px 0 8px}
.block h3{font-size:25px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.mark{display:inline-grid;place-items:center;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;font-family:var(--sans);font-size:14px;font-weight:400}
.box{border:1px solid var(--line);border-radius:16px;padding:18px 18px 6px;margin:0 0 18px}
.box h3{font-size:22px;margin-bottom:8px}
.warn{background:var(--warn-bg);border-color:var(--sand);margin-bottom:30px}
.warn h3{color:var(--sand)}
details{border-top:1px solid var(--line-soft);padding:18px 0}
summary{cursor:pointer;font-family:var(--serif);font-size:24px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--sans);font-weight:400;font-size:24px;color:var(--muted)}
details[open] summary::after{content:"–"}
details .inner{padding-top:14px}
.tbl{overflow-x:auto;margin:6px 0 18px;border:1px solid var(--line-soft);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:14.5px}
th,td{text-align:left;padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--line-soft)}
th{font-weight:500;color:var(--muted)}
tr:last-child td{border-bottom:none}
ul{padding-left:20px;margin:0 0 14px}
li{margin-bottom:8px}
.closing{font-family:var(--serif);font-size:23px;line-height:1.3;border-top:1px solid var(--line-soft);padding-top:24px;margin:10px 0 26px}
.actions{display:flex;flex-direction:column;gap:6px;align-items:center}

.fade{animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar span{transition:none}}

.ans.has-ico{align-items:center}
.ans .ico{flex:0 0 28px;width:28px;height:46px}
.ans[aria-pressed="true"] .ico path{stroke:#382F2E}
.res-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.res-art{flex:0 0 60px;width:60px;height:100px;margin-top:4px}
.subtype{color:var(--muted);font-size:16px;margin:-8px 0 24px}
.code{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 10px;margin-right:8px;color:var(--cream);font-size:14px}
.steps{padding-left:22px;margin:0 0 22px}
.steps li{margin-bottom:10px}
strong{font-weight:500}
.secondary{display:block;width:100%;padding:15px 20px;border:1px solid var(--cream);border-radius:999px;background:transparent;color:var(--cream);font-weight:500;font-size:16px;cursor:pointer}
.copied{font-size:14px;color:var(--muted);min-height:20px}
.actions .primary{margin-top:8px}
.links{margin-top:10px;gap:10px}
.links .secondary{margin:0}
.intro p{font-size:18px}
.box p{margin-bottom:12px}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
/* ---------- Fragen ---------- */
/* Hitze-Tool-Check: Welches Gerät passt zu deinem Wunschergebnis und hält bei deinem Haar?
   Lauras Regel: Je glatter, je weniger Eigenvolumen, je länger und schwerer die Haare, desto schneller fällt ein Blowout.
   Der Lockenstab hält länger als Multistyler-Locken, weil er punktueller und heißer arbeitet.
   Strukturiertes Haar (wellig bis kraus) hält Styling viel besser, strapaziertes Haar oft auch. */
const QS = [
 {id:"ziel", t:"Was möchtest du mit deinem Gerät vor allem machen?", a:[
  ["Einfach schnell trocknen",{z:"dry"}],["Ein Blowout mit Schwung und Volumen",{z:"blow"}],["Locken oder Wellen",{z:"curl"}],["Glatte Haare",{z:"straight"}],["Von allem etwas",{z:"all"}]]},
 {id:"struktur", t:"Wie fallen deine Haare von Natur aus, wenn sie an der Luft trocknen?", a:[
  ["Ganz glatt und eher rutschig",{p:0,g:"G",silk:1}],["Glatt, aber mit etwas Struktur oder leichtem Schwung",{p:2,g:"G"}],["Wellig",{p:3,g:"W"}],["Lockig",{p:4,g:"L"}],["Stark lockig bis kraus",{p:4,g:"K"}]]},
 {id:"dicke", t:"Wie dick ist ein einzelnes Haar?", h:"Nicht sicher? Das findest du im Pflege-Check heraus.", a:[
  ["Fein",{p:0,fein:1}],["Normal",{p:1}],["Dick",{p:1,dick:1}]]},
 {id:"volumen", t:"Wie viel Volumen haben deine Haare von Natur aus?", a:[
  ["Wenig, sie liegen eher platt am Kopf",{p:0,flat:1}],["Normal",{p:1}],["Viel",{p:2,viel:1}]]},
 {id:"laenge", t:"Wie lang sind deine Haare?", a:[
  ["Kurz, höchstens bis zum Kinn",{p:2}],["Etwa schulterlang",{p:2}],["Bis zur Brust",{p:1,lang:1}],["Bis zur Taille oder länger",{p:0,lang:2}]]},
 {id:"stufen", t:"Hast du Stufen im Haar?", a:[
  ["Nein, alles ist etwa gleich lang",{p:0}],["Nur vorne ums Gesicht ist es kürzer",{p:0}],["Ja, Stufen im ganzen Haar",{p:1,stufen:1}],["Weiß ich nicht",{p:0}]]},
 {id:"halt", t:"Wenn du schon mal Locken oder ein Blowout gemacht hast: Wie lange hat es gehalten?", a:[
  ["Nach kurzer Zeit war es wieder raus",{p:-3,kurz:1}],["Ein paar Stunden",{p:0}],["Den ganzen Tag oder länger",{p:3,lange:1}],["Habe ich noch nie ausprobiert",{p:0}]]},
 {id:"zustand", t:"Sind deine Haare gerade stark strapaziert?", h:"Zum Beispiel blondiert, oft gefärbt, viel Hitze, oder sie brechen schnell.", a:[
  ["Ja",{p:1,dam:1}],["Nein",{p:0}]]}
];
const FINE = "Ich bin keine Friseurin. Wie gut Styling hält, ist sehr individuell und hängt auch von deinem Schnitt, deinen Produkten und deiner Technik ab. In der Haarwelt ist fast alles möglich, dein Ergebnis ist deshalb eine Empfehlung und kein Urteil. Nimm es als Hilfe und Orientierung.";
const HALT = {low:"eher kurz", mid:"ein paar Stunden", high:"gut"};
const CATS = {foehn:"Föhne", reise:"Reiseföhne", multi:"Multistyler", glaett:"Glätteisen & Luftglätter", locken:"Lockenstäbe"};
const TIPS = `<ul><li>Arbeite mit dünnen Strähnen, dann wird jede Strähne gleichmäßig warm.</li><li>Lass jede Locke oder Welle abkühlen, bevor du sie loslässt, zum Beispiel in der Hand oder mit einer Klammer festgesteckt. Erst beim Abkühlen bekommt das Haar seine neue Form.</li><li>Bei Föhn und Multistyler fixierst du am Ende mit einem kurzen Kaltluftstoß.</li><li>Die Haare müssen vorher komplett trocken sein, Feuchtigkeit lässt Styling schnell zusammenfallen.</li></ul>`;

/* ---------- Ablauf ---------- */
const app = document.getElementById("app");
let ans = {}, pos = 0;
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const reduce = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const startArt = `<svg class="strand" viewBox="0 0 300 420" fill="none" aria-hidden="true">
  <path d="${(()=>{let d="M255 0";for(let y=0;y<=420;y+=4){d+=" L"+(255-y*0.45+10*Math.sin(y/22)).toFixed(1)+" "+y;}return d;})()}" stroke="#F3ECE2" stroke-width="1"/>
  <path d="${(()=>{let d="M285 0";for(let y=0;y<=420;y+=2){d+=" L"+(285-y*0.45+14*Math.sin(y/9)).toFixed(1)+" "+y;}return d;})()}" stroke="#9E8C80" stroke-width="1"/></svg>`;
function start(){
  ans = {}; pos = 0;
  app.innerHTML = `<section class="start fade">${startArt}
    <div class="by">Ein Quiz von Laura, deiner Haarpflege-Bestie</div>
    <h1>Welches Hitze-Tool passt zu dir?</h1>
    <p class="lead">Multistyler, Lockenstab, Glätteisen oder doch nur ein guter Föhn? Du erfährst, welches Gerät für dein Wunschergebnis bei deinem Haar wirklich hält, bevor du Geld ausgibst.</p>
    <p class="how">Acht kurze Fragen, ungefähr zwei Minuten.</p>
    <button class="primary" id="go">Quiz starten</button>
    <p class="fine">${FINE}</p>
  </section>`;
  document.getElementById("go").onclick = () => { pos = 0; render(); };
  window.scrollTo(0,0);
}
function render(){
  const q = QS[pos], sel = ans[q.id] ?? null;
  app.innerHTML = `<section class="q fade">
    <div class="top"><button class="ghost" id="back">Zurück</button><span class="count">Frage ${pos+1} von ${QS.length}</span></div>
    <div class="bar"><span style="width:${(pos/QS.length)*100}%"></span></div>
    <h2>${esc(q.t)}</h2>
    ${q.h ? `<p class="hint">${esc(q.h)}</p>` : ""}
    <div class="answers">${q.a.map((a,i)=>`<button class="ans" data-i="${i}" aria-pressed="${sel===i}"><span class="dot"></span><span>${esc(a[0])}</span></button>`).join("")}</div>
  </section>`;
  document.getElementById("back").onclick = () => { if(pos===0) start(); else { pos--; render(); } };
  app.querySelectorAll(".ans").forEach(b => b.onclick = () => {
    ans[q.id] = +b.dataset.i;
    app.querySelectorAll(".ans").forEach(x => x.setAttribute("aria-pressed", x===b));
    setTimeout(advance, reduce()?0:260);
  });
  window.scrollTo(0,0);
}
function advance(){ if(pos < QS.length-1){ pos++; render(); } else briefOeffnen(result); }
const v = id => QS.find(q=>q.id===id).a[ans[id]][1];

/* ---------- Auswertung ---------- */
function evaluate(){
  const z = v("ziel").z, s = v("struktur"), g = s.g;
  let p = 0, f = {};
  QS.forEach(q => { const x = q.a[ans[q.id]][1]; if(x.p) p += x.p; Object.keys(x).forEach(k => { if(k!=="p" && k!=="z" && k!=="g") f[k] = x[k]; }); });
  let lvl = p <= 3 ? "low" : p <= 7 ? "mid" : "high";
  /* Strukturiertes Haar hält Styling deutlich besser, solange es bisher nicht schnell rausgefallen ist */
  if(g !== "G" && !f.kurz) lvl = "high";
  if(f.kurz && lvl === "high") lvl = "mid";
  /* Unrealistisch: ganz glatt und rutschig, wenig Eigenvolumen und bisher hält nichts */
  const unreal = !!(f.silk && f.flat && f.kurz);
  return {z, g, lvl, f, unreal};
}
function plan(e){
  const {z, g, lvl, f, unreal} = e;
  const curly = g==="L" || g==="K";
  if(z==="dry") return {rec:"Ein guter Föhn", links:["foehn","reise"],
    text:`<p>Für schnelles Trocknen brauchst du keinen Multistyler, ein guter Föhn reicht völlig. Föhn lieber auf mittlerer oder kühler Stufe statt heiß.</p>`
      + (curly ? `<p>Mit einem Diffusor betonst du dabei deine Locken, statt sie auseinanderzupusten.</p>` : g==="W" ? `<p>Wenn du deine Wellen betonen möchtest, nimm einen Diffusor.</p>` : `<p>Mit einer Glättdüse wird es gleich etwas glatter und glänzender.</p>`)};
  if(z==="blow"){
    if(unreal) return {rec:"Lieber ein Lockenstab als ein Multistyler", honest:true, links:["locken","foehn","multi"],
      text:`<p>Ein Blowout, der lange hält, ist bei deinen Haaren sehr unrealistisch. Glatte, rutschige Haare mit wenig Eigenvolumen fallen schnell wieder zusammen, egal ob mit Multistyler oder Rundbürste. Das liegt nicht an dir und nicht am Gerät, sondern an deiner Haarstruktur.</p>
      <p>Alle Hersteller werben damit, dass ihr Multistyler bei jedem Haar funktioniert. Das stimmt so nicht. Für einen Blowout würde ich dir deshalb keinen teuren Multistyler empfehlen. Ein Lockenstab ist deutlich günstiger und arbeitet punktueller und mit mehr Hitze, deshalb halten die Wellen bei dir länger. Mit einem großen Durchmesser bekommst du Schwung, der an ein Blowout erinnert.</p>
      <p>Einen Multistyler kannst du natürlich trotzdem nutzen, zum Föhnen und Glattföhnen. Überleg dir nur vorher, wofür du ihn wirklich brauchst.</p>`};
    if(lvl==="low") return {rec:"Für Schwung, der hält: ein Lockenstab", links:["locken","multi","foehn"],
      text:`<p>Ein Blowout mit Multistyler oder Rundbürste hält bei dir wahrscheinlich nur kurz. Wenn du Schwung möchtest, der länger hält, greif lieber zum Lockenstab mit großem Durchmesser. Er arbeitet punktueller und mit mehr Hitze, deshalb halten die Wellen länger.</p>
      <p>Ein Blowout ist bei dir nicht unmöglich, mit den Tipps unten hält es länger. Plan nur ein, dass es nach ein paar Stunden nachlässt.</p>`};
    if(lvl==="mid") return {rec:"Multistyler oder Föhn mit Rundbürste", links:["multi","foehn","locken"],
      text:`<p>Ein Blowout klappt bei dir mit Multistyler oder Föhn und Rundbürste und hält meistens ein paar Stunden. Mit den Tipps unten hält es länger.</p>
      <p>Wenn dein Schwung den ganzen Tag halten soll, sind große Wellen vom Lockenstab die sicherere Wahl.</p>`};
    return {rec:"Multistyler oder Föhn mit Rundbürste", links:["multi","foehn"], spray:curly,
      text: curly ? `<p>Ein Blowout hält bei deinem strukturierten Haar richtig gut, oft sogar mehrere Tage. Rechne bei Locken mit etwas mehr Zeit: Föhn Strähne für Strähne mit der Glätt- oder Rundbürste. Luftfeuchtigkeit macht die Haare schnell wieder krauser, ein Styling-Spray gegen Frizz hilft.</p>`
        : `<p>Ein Blowout hält bei dir gut${g!=="G"?", bei Wellen oft sogar mehrere Tage":""}. Ein Multistyler lohnt sich bei dir, genauso gut klappt es mit Föhn und Rundbürste.</p>`};
  }
  if(z==="curl"){
    if(curly) return {rec:"Föhn mit Diffusor", links:["foehn","locken"],
      text:`<p>Deine eigenen Locken sind dein bestes Styling. Mit einem Diffusor föhnst du sie definiert, ohne sie auseinanderzupusten, am besten mit einer Leave-in-Creme, die du ins nasse Haar knetest. Einen Lockenstab brauchst du höchstens, um einzelne Strähnen nachzuformen.</p>`};
    if(lvl==="low") return {rec:"Ein Lockenstab", honest:unreal, links:["locken","multi"],
      text:`<p>Locken vom Multistyler fallen bei dir sehr wahrscheinlich schnell wieder raus. Ein Lockenstab arbeitet punktueller und mit mehr Hitze, deshalb halten seine Locken bei dir deutlich länger.</p>`
        + (unreal ? `<p>Bei sehr glattem, rutschigem Haar mit wenig Eigenvolumen können auch Lockenstab-Locken schnell aushängen. Sie halten aber trotzdem länger als Locken vom Multistyler. Mit den Tipps unten holst du das Meiste raus.</p>` : `<p>Mit den Tipps unten halten sie noch länger.</p>`)};
    if(lvl==="mid") return {rec:"Ein Lockenstab", links:["locken","multi"],
      text:`<p>Am längsten halten bei dir Locken vom Lockenstab, weil er punktueller und mit mehr Hitze arbeitet. Für lockere Wellen geht auch ein Multistyler, die halten bei dir aber meistens kürzer.</p>`};
    return {rec:"Lockenstab oder Multistyler", links:["locken","multi"],
      text:`<p>Bei dir halten Locken gut, du kannst also nach deinem Geschmack wählen. Der Lockenstab macht definiertere Locken, der Multistyler ist bequemer und föhnt gleichzeitig.</p>`};
  }
  if(z==="straight"){
    if(g==="G") return {rec:"Föhn mit Glättdüse", links:["foehn","glaett"],
      text:`<p>Deine Haare sind von Natur aus glatt, ein Föhn mit Glättdüse reicht für ein glattes, glänzendes Ergebnis. Ein Glätteisen brauchst du nur, wenn es extra glatt sein soll oder für Spitzen, die nach innen fallen.</p>`};
    if(g==="W") return {rec:"Luftglätter oder Föhn mit Glättbürste", links:["glaett","foehn","multi"],
      text:`<p>Wellen bekommst du mit einem Luftglätter glatt, der trocknet und glättet in einem Schritt. Alternativ föhnst du mit einer Glättbürste oder einem Multistyler-Glättaufsatz und gehst bei Bedarf mit dem Glätteisen nach.</p>`};
    return {rec:"Rundbürste, Luftglätter oder Glätteisen", links:["foehn","glaett","multi"], spray:true,
      text:`<p>Welches Gerät zu dir passt, hängt davon ab, wie glatt es werden soll:</p>
      <ul><li><strong>Glatt mit Volumen:</strong> Föhn mit Rundbürste. So bekommst du glatte Haare mit Schwung und Fülle.</li>
      <li><strong>Glatt und unkompliziert:</strong> Ein Luftglätter trocknet und glättet in einem Schritt, auch im nassen Haar.</li>
      <li><strong>Richtig sleek und glatt:</strong> Das Glätteisen. Föhn die Haare vorher möglichst glatt, dann brauchst du weniger Durchgänge.${f.dick||f.viel ? " Bei dicken oder vielen Haaren sparen dir breite Platten viel Zeit." : ""}</li></ul>
      <p>Luftfeuchtigkeit macht glatt gestylte Locken schnell wieder krauser, ein Styling-Spray gegen Frizz hilft.</p>`};
  }
  /* von allem etwas */
  if(lvl==="low") return {rec:"Föhn und Lockenstab statt Multistyler", honest:unreal, links:["foehn","locken","multi"],
    text:`<p>Ein Multistyler kann vieles, aber Blowouts und Locken vom Multistyler halten bei dir wahrscheinlich nur kurz. Ein guter Föhn plus ein Lockenstab ist meistens günstiger und hält bei dir besser.</p>`};
  return {rec:"Ein Multistyler", links:["multi","foehn","locken"],
    text:`<p>Ein Multistyler lohnt sich bei dir, weil Styling bei deinen Haaren ${lvl==="high"?"gut":"ein paar Stunden"} hält. Du föhnst, glättest und machst Wellen mit einem Gerät.${lvl==="mid" ? " Wenn Locken den ganzen Tag halten sollen, ist ein Lockenstab die sicherere Ergänzung." : ""}</p>`};
}
function result(){
  const e = evaluate(), r = plan(e), f = e.f;
  try { const all = JSON.parse(localStorage.getItem("quizErgebnisse")||"null") || {}; all.tools = {ziel:e.z, halt:e.lvl}; localStorage.setItem("quizErgebnisse", JSON.stringify(all)); } catch(err){}
  const styled = e.z !== "dry";
  const extra = [];
  if(styled && f.lang && !f.stufen) extra.push(`<div class="box"><h3>Länge und Schnitt</h3><p>Je länger und schwerer die Haare sind, desto schneller hängt jedes Styling aus. Stufen können helfen, dass Locken und Blowouts besser halten. Ob und wie viele Stufen zu deinem Haar passen, besprichst du am besten mit deinem Friseur, denn bei feinem Haar oder wenig Haaren können Stufen die Längen dünner wirken lassen.</p></div>`);
  else if(styled && f.lang) extra.push(`<div class="box"><h3>Länge</h3><p>Je länger und schwerer die Haare sind, desto schneller hängt jedes Styling aus. Deine Stufen helfen dabei, dass es besser hält.</p></div>`);
  if(styled && f.dam) extra.push(`<div class="box"><h3>Strapazierte Haare</h3><p>Strapazierte Haare halten Locken oft sogar besser. Fürs Styling ist das praktisch, für die Gesundheit deiner Haare aber nicht. Nimm deshalb die niedrigste Temperatur, mit der es klappt, und nie ohne Hitzeschutz.</p></div>`);
  else if(styled && e.g==="G" && e.lvl!=="high") extra.push(`<div class="box"><h3>Ganz normal</h3><p>Je gesünder und glatter deine Haare sind, desto schneller fällt Styling wieder heraus. Das ist ganz normal und kein Zeichen, dass du etwas falsch machst.</p></div>`);
  app.innerHTML = `<section class="res fade">
    <div class="top"><button class="ghost" id="back">Zurück</button><span class="count">Dein Ergebnis</span></div>
    <p class="res-kicker">Für dein Wunschergebnis empfehle ich dir</p>
    <h1>${esc(r.rec)}</h1>
    ${styled ? `<p class="subtype"><span class="code">Halt</span>So lange hält Styling bei dir: ${HALT[e.lvl]}</p>` : ""}
    ${r.honest ? `<div class="box warn"><h3>Ehrlich gesagt</h3>${r.text}</div>` : `<div class="intro">${r.text}</div>`}
    ${styled && e.z!=="straight" && !(e.z==="curl" && (e.g==="L"||e.g==="K")) ? `<div class="block"><h3><span class="mark">✓</span>So hält dein Styling länger</h3>${TIPS}</div>` : ""}
    ${extra.join("")}
    <div class="block"><h3><span class="mark">!</span>Vor jeder Hitze</h3><p>Gib immer einen Hitzeschutz in die Haare und stell dein Gerät nicht heißer ein als nötig. Auch beim Föhnen lieber mittel oder kühl statt heiß.</p>${r.spray ? `
      <p><strong>Tipp für glatte Haare trotz Luftfeuchtigkeit:</strong> Ein Styling-Spray gegen Frizz ist Styling und Hitzeschutz in einem. Du sprühst es ins feuchte Haar und föhnst es mit Zug glatt, die Hitze aktiviert einen Film, der Feuchtigkeit abhält.</p>
      <div class="actions links"><button class="secondary" data-hitze="styling">Styling-Sprays gegen Frizz ansehen</button></div>` : ""}</div>
    <div class="block"><h3><span class="mark">→</span>Meine Empfehlungen</h3><p>Schau dir passende Geräte bei den Hitze-Tools an:</p>
      <div class="actions links">${r.links.map(k=>`<button class="secondary" data-cat="${k}">${CATS[k]} ansehen</button>`).join("")}</div></div>
    <details><summary>Gut zu wissen</summary><div class="inner">
      <p><strong>Warum Styling bei manchen Haaren nicht hält.</strong> Hitze löst die Wasserstoffbrücken im Haar, beim Abkühlen bilden sie sich in der neuen Form wieder. Feuchtigkeit und das Gewicht der Haare ziehen sie wieder auseinander. Glattes, schweres und sehr gesundes Haar fällt deshalb schneller in seine alte Form zurück.</p>
      <p><strong>Multistyler sind kein Wundermittel.</strong> Sie arbeiten mit warmer Luft statt mit heißen Platten oder einem heißen Stab. Das ist schonender, hält bei glatten Haaren aber oft kürzer.</p>
    </div></details>
    <div class="actions"><button class="secondary" id="copyRes">Ergebnis kopieren</button><span class="copied" id="copied" role="status"></span>
      <button class="ghost" id="again">Quiz neu starten</button></div>
    <p class="fine">${FINE}</p>
  </section>`;
  document.getElementById("back").onclick = () => { pos = QS.length-1; render(); };
  document.getElementById("again").onclick = start;
  document.getElementById("copyRes").onclick = copyResult;
  app.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => openTools(b.dataset.cat));
  app.querySelectorAll("[data-hitze]").forEach(b => b.onclick = () => openTools(b.dataset.hitze, "hitze"));
  window.scrollTo(0,0);
}
function openTools(cat, type){
  type = type || "tools";
  try { if(window.parent !== window && window.parent.showProducts){ window.parent.closeQuiz && window.parent.closeQuiz(); window.parent.showProducts(type, cat); return; } } catch(e){}
  location.href = "haarpflege.html#" + type + "." + cat;
}
/* ---------- Ergebnis kopieren ---------- */
async function copyResult(){
  const sec = app.querySelector("section");
  const t = [...sec.children].filter(el => !el.matches(".top,.actions,.fine,details") && !el.querySelector("[data-cat]")).map(el => el.innerText.replace("Styling-Sprays gegen Frizz ansehen","").trim()).filter(Boolean).join("\n\n");
  let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch(e){}
  if(!ok){ const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { ok = document.execCommand("copy"); } catch(e){} ta.remove(); }
  document.getElementById("copied").textContent = ok ? "Kopiert. Du kannst es jetzt in deine Notizen einfügen." : "Kopieren hat leider nicht geklappt.";
}
start();
