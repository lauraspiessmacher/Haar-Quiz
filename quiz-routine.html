<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Routine-Check</title>
<style>
:root{
  --bg:#382F2E;
  --surface:#433836;
  --cream:#F3ECE2;
  --muted:#C9BCAE;
  --line:rgba(243,236,226,.5);
  --line-soft:rgba(243,236,226,.18);
  --taupe:#9E8C80;
  --sand:#E9DFD2;
  --warn-bg:#4A3D35;
  --serif:"Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "Noto Serif", Georgia, serif;
  --sans:"Avenir Next", Avenir, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#382F2E; --cream:#F3ECE2; } }
:root[data-theme="dark"]{ --bg:#382F2E; --cream:#F3ECE2; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font-family:var(--sans);font-weight:400;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:28px 22px 48px}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.1}
p{margin:0 0 14px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sand);outline-offset:3px}

/* Start */
.start{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;position:relative}
.strand{position:absolute;top:0;right:-22px;width:62%;max-width:300px;opacity:.55;pointer-events:none}
.by{font-size:14px;color:var(--muted);margin-bottom:28px;letter-spacing:.02em}
.start h1{font-size:clamp(46px,13vw,68px);letter-spacing:-.01em;margin-bottom:22px;max-width:9ch}
.start .lead{font-size:18px;color:var(--cream);max-width:34ch}
.start .how{color:var(--muted);font-size:15px;max-width:38ch;margin-bottom:30px}
.primary{display:block;width:100%;padding:17px 20px;border:1px solid var(--cream);border-radius:999px;background:var(--cream);color:var(--bg);font-weight:500;font-size:17px;cursor:pointer}
.primary:active{transform:scale(.99)}
.ghost{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:4px}
.fine{font-size:13px;color:var(--muted);line-height:1.5;margin-top:26px;border-top:1px solid var(--line-soft);padding-top:16px}

/* Question */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;min-height:40px}
.count{font-size:14px;color:var(--muted)}
.bar{height:2px;background:var(--line-soft);border-radius:2px;overflow:hidden;margin-bottom:38px}
.bar span{display:block;height:100%;background:var(--cream);transition:width .35s ease}
.q h2{font-size:clamp(30px,8vw,38px);margin-bottom:12px}
.hint{color:var(--muted);font-size:15px;margin-bottom:22px}
.answers{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.ans{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:transparent;cursor:pointer;font-size:16.5px;line-height:1.4;transition:background .15s,border-color .15s,color .15s}
.ans .dot{flex:0 0 18px;height:18px;margin-top:2px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}
.ans.multi .dot{border-radius:5px}
.ans[aria-pressed="true"]{background:var(--cream);color:var(--bg);border-color:var(--cream)}
.ans[aria-pressed="true"] .dot{border-color:var(--bg);background:var(--bg)}
.ans[aria-pressed="true"] .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--cream)}
.ans.multi[aria-pressed="true"] .dot::after{border-radius:1px}
@media (hover:hover){.ans:hover{border-color:var(--cream)}}
.next{margin-top:26px}
.next[disabled]{opacity:.35;cursor:default}

/* Result */
.res-kicker{font-size:15px;color:var(--muted);margin-bottom:8px}
.res h1{font-size:clamp(44px,12vw,62px);margin-bottom:20px}
.res .intro{font-size:18px;margin-bottom:28px}
.block{border-top:1px solid var(--line-soft);padding:22px 0 8px}
.block h3{font-size:25px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.mark{display:inline-grid;place-items:center;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;font-family:var(--sans);font-size:14px;font-weight:400}
.box{border:1px solid var(--line);border-radius:16px;padding:18px 18px 6px;margin:0 0 18px}
.box h3{font-size:22px;margin-bottom:8px}
.warn{background:var(--warn-bg);border-color:var(--sand);margin-bottom:30px}
.warn h3{color:var(--sand)}
details{border-top:1px solid var(--line-soft);padding:18px 0}
summary{cursor:pointer;font-family:var(--serif);font-size:24px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--sans);font-weight:400;font-size:24px;color:var(--muted)}
details[open] summary::after{content:"–"}
details .inner{padding-top:14px}
.tbl{overflow-x:auto;margin:6px 0 18px;border:1px solid var(--line-soft);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:14.5px}
th,td{text-align:left;padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--line-soft)}
th{font-weight:500;color:var(--muted)}
tr:last-child td{border-bottom:none}
ul{padding-left:20px;margin:0 0 14px}
li{margin-bottom:8px}
.closing{font-family:var(--serif);font-size:23px;line-height:1.3;border-top:1px solid var(--line-soft);padding-top:24px;margin:10px 0 26px}
.actions{display:flex;flex-direction:column;gap:6px;align-items:center}

.fade{animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar span{transition:none}}

.ans.has-ico{align-items:center}
.ans .ico{flex:0 0 28px;width:28px;height:46px}
.ans[aria-pressed="true"] .ico path{stroke:#382F2E}
.res-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.res-art{flex:0 0 60px;width:60px;height:100px;margin-top:4px}
.subtype{color:var(--muted);font-size:16px;margin:-8px 0 24px}
.code{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 10px;margin-right:8px;color:var(--cream);font-size:14px}
.steps{padding-left:22px;margin:0 0 22px}
.steps li{margin-bottom:10px}
strong{font-weight:500}
/* Routine-Check */
.pre{border:1px solid var(--line-soft);border-radius:16px;padding:16px 18px 6px;margin:0 0 26px}
.pre h3{font-size:21px;margin-bottom:8px}
.pre ul{list-style:none;padding:0;margin:0 0 10px}
.pre li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-top:1px solid var(--line-soft);padding:9px 0;margin:0;font-size:15.5px}
.pre li:first-child{border-top:0}
.pre a{color:var(--cream);text-underline-offset:4px;white-space:nowrap}
.pre .ok{color:var(--muted);white-space:nowrap}
.from{display:inline-block;font-size:13.5px;color:var(--muted);border:1px solid var(--line-soft);border-radius:999px;padding:3px 11px;margin:-6px 0 12px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:22px}
.days .ans{justify-content:center;padding:14px 0;border-radius:12px;font-size:15px}
.days .ans .dot{display:none}
@media (max-width:380px){ .days{grid-template-columns:repeat(4,minmax(0,1fr))} }
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:-6px 0 22px}
.chips span{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px}
.week{width:100%;min-width:0;font-size:15px}
.week td:first-child{width:7.5em;font-family:var(--serif);font-size:19px;line-height:1.2}
.week td:first-child small{display:block;font-family:var(--sans);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.week tr.wash td{background:rgba(243,236,226,.06)}
.week ul{margin:0;padding-left:18px}
.week li{margin-bottom:4px}
.tblw{overflow:visible}
@media (max-width:520px){
  .week,.week tbody,.week tr,.week td{display:block;width:100%}
  .week tr{border-bottom:1px solid var(--line-soft);padding:8px 0}
  .week tr:last-child{border-bottom:0}
  .week td{border:0;padding:4px 12px}
  .week td:first-child{width:auto}
}
.copyrow{display:flex;flex-direction:column;gap:6px;align-items:center;margin:10px 0 6px}
.secondary{display:block;width:100%;padding:15px 20px;border:1px solid var(--cream);border-radius:999px;background:transparent;color:var(--cream);font-weight:500;font-size:16px;cursor:pointer}
.copied{font-size:14px;color:var(--muted);min-height:20px}
h2.sec{font-size:30px;margin:34px 0 14px}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
/* ---------- Was wir schon wissen: andere Quizze und „Meine Haare“ ---------- */
const load = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch(e){ return null; } };
const PREV = load("quizErgebnisse") || {};
const ME = load("meineHaare") || {};
const PRE = {};
if(PREV.kopfhaut) PRE.kopf = [{N:"normal",F:"fettend",T:"trocken",S:"sensibel",ST:"schuppen",SF:"schuppen"}[PREV.kopfhaut.key], "deinem Kopfhaut-Check"];
else if(ME.kopf) PRE.kopf = [ME.kopf === "juckend" ? "sensibel" : ME.kopf, "„Meine Haare“"];
if(ME.dicke) PRE.dicke = [ME.dicke, "„Meine Haare“"];
else if(PREV.pflege) PRE.dicke = [["fein","normal","dick"][PREV.pflege.th], "deinem Pflege-Check"];
if(PREV.haar) PRE.struktur = [{G1:"glatt",GT:"glatt",W:"wellig",L:"lockig",E:"lockig"}[PREV.haar.key], "deinem Haar-Check"];
if(PREV.pflege){
  const P = PREV.pflege, src = "deinem Pflege-Check";
  if(P.laenge) PRE.laenge = [P.laenge, src];
  if(P.chem) PRE.chem = [P.chem, src];
  if(P.zustand) PRE.zustand = [P.zustand, src];
  if(P.spliss) PRE.spliss = [P.spliss, src];
  if(P.hitze) PRE.hitze = [P.hitze, src];
}

/* ---------- Fragen ---------- */
const TAGE = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const Q = [
 {id:"kopf", t:"Wie ist deine Kopfhaut?", a:[
  ["Unkompliziert","normal"],["Fettet schnell","fettend"],["Eher trocken, spannt manchmal","trocken"],["Sensibel oder juckt oft","sensibel"],["Schuppig","schuppen"]]},
 {id:"dicke", t:"Wie dick ist ein einzelnes Haar bei dir?", h:"Gemeint ist der Durchmesser eines Haares, nicht wie viele Haare du hast.", a:[
  ["Sehr fein, ich spüre es kaum","fein"],["Dünn","duenn"],["Normal, ungefähr wie ein Nähfaden","normal"],["Dick","dick"],["Sehr dick, fast drahtig","sehrdick"]]},
 {id:"struktur", t:"Wie fallen deine Haare von Natur aus?", a:[
  ["Glatt","glatt"],["Wellig","wellig"],["Lockig","lockig"]]},
 {id:"laenge", t:"Wie lang sind deine Haare?", a:[
  ["Bis zum Kinn oder kürzer","kinn"],["Bis zur Schulter","schulter"],["Bis zur Brust","brust"],["Länger","lang"]]},
 {id:"chem", t:"Was davon trifft auf deine Haare zu?", h:"Du kannst mehreres auswählen.", multi:true, a:[
  ["Gefärbt","gefaerbt"],["Blondiert, auch Strähnchen","blond"],["Dauerwelle oder chemische Glättung","chemie"],["Nichts davon","nichts"]]},
 {id:"zustand", t:"Wie fühlen sich deine Längen an?", a:[
  ["Weich und geschmeidig","weich"],["Etwas trocken, die Spitzen sind rau","trocken"],["Strohig, sie verknoten schnell","strohig"],["Nass dehnen sie sich wie Gummi und reißen leicht","gummi"]]},
 {id:"spliss", t:"Hast du Spliss oder Haarbruch?", a:[
  ["Kaum","kaum"],["Spliss, in den Spitzen oder auch in den Längen","spliss"],["Viele kurze, abgebrochene Haare oder Bruch beim Kämmen","bruch"]]},
 {id:"wash", t:"Wie oft wäschst du deine Haare pro Woche?", h:"Wenn es schwankt, nimm das, was am häufigsten vorkommt.", a:[
  ["Einmal","1"],["Zweimal","2"],["Dreimal","3"],["Viermal","4"],["Fünfmal oder öfter","5"]]},
 {id:"sport", t:"Machst du Sport?", a:[
  ["Kaum oder gar nicht","nein"],["Ja, eher ruhig, zum Beispiel Yoga oder Krafttraining","ruhig"],["Ja, mit viel Bewegung, zum Beispiel Joggen, Tanzen oder Ballsport","viel"]]},
 {id:"sporttage", t:"An welchen Tagen machst du meistens Sport?", h:"Du kannst mehrere Tage auswählen.", multi:true, days:true, if: a => a.sport && a.sport !== "nein",
  a: TAGE.map((d,i) => [d.slice(0,2), String(i)])},
 {id:"styling", t:"Wie oft benutzt du Styling-Produkte?", h:"Zum Beispiel Haarspray, Schaum, Gel oder Texturspray.", a:[
  ["Kaum","kaum"],["Ab und zu","manchmal"],["Fast täglich","viel"]]},
 {id:"hitze", t:"Wie oft benutzt du Glätteisen, Lockenstab oder heißen Föhn?", a:[
  ["Selten oder nie","selten"],["Ein- bis zweimal pro Woche","manchmal"],["Fast täglich","taeglich"]]},
 {id:"schlaf", t:"Wie schläfst du meistens?", h:"Du kannst mehreres auswählen.", multi:true, a:[
  ["Mit offenen Haaren","offen"],["Mit lockerem Dutt oder Pferdeschwanz","zopf"],["Mit geflochtenen Haaren","flecht"],["Mit Seidenhaube","haube"],["Auf einem Kissenbezug aus Seide oder Bambusviskose","kissen"]]},
 {id:"aufwand", t:"Wie viel Zeit und Lust hast du für deine Haarpflege?", a:[
  ["Wenig, es soll schnell gehen","wenig"],["Ein bisschen, wenn es sich lohnt","mittel"],["Viel, ich liebe Haarpflege","viel"]]}
];
const FINE = "Ich bin keine Ärztin und keine Friseurin, dieses Quiz ersetzt keine persönliche Beratung. Dein Wochenplan ist ein Beispiel und eine Orientierung, keine feste Regel. Verschieb die Tage ruhig so, wie sie in deinen Alltag passen.";

/* ---------- Ablauf ---------- */
const app = document.getElementById("app");
let ans = {}, touched = {}, idx = -1;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const vis = () => Q.filter(q => !q.if || q.if(ans));

function openOther(f){
  try { if(window.parent !== window && window.parent.openQuiz && window.parent.openQuiz(f)) return; } catch(e){}
  location.href = f;
}

function start(){
  idx = -1; ans = {}; touched = {};
  Object.entries(PRE).forEach(([k,v]) => { if(v[0]) ans[k] = v[0]; });
  const done = [["kopfhaut","quiz-kopfhaut.html","Kopfhaut-Check"],["pflege","quiz-pflege.html","Pflege-Check"],["haar","quiz-haar.html","Haar-Check"]];
  const missing = done.filter(d => !PREV[d[0]]).length;
  app.innerHTML = `<section class="start fade">
    <div class="by">Ein Quiz von Laura, deiner Haarpflege-Bestie</div>
    <h1>Deine Routine</h1>
    <p class="lead">Viele von euch fragen mich, ob ich ihnen eine Routine zusammenstellen kann. Hier bekommst du deinen persönlichen Wochenplan: wann du am besten wäschst, wann eine Maske dran ist und was du zwischen den Wäschen, beim Sport und nachts für deine Haare tun kannst.</p>
    <p class="how">Bis zu 14 kurze Fragen, ungefähr drei Minuten.</p>
    <div class="pre"><h3>${missing ? "Tipp: Mach zuerst die anderen drei Quizze" : "Deine Quizze kennt dieses Quiz schon"}</h3>
      ${missing ? `<p class="hint" style="margin-bottom:8px">Dann kennt dieses Quiz deine Haare schon, du musst weniger beantworten und dein Plan wird genauer.</p>` : ""}
      <ul>${done.map(d => `<li><span>${d[2]}</span>${PREV[d[0]] ? `<span class="ok">✓ erledigt</span>` : `<a href="${d[1]}" data-quiz="${d[1]}">jetzt machen</a>`}</li>`).join("")}</ul></div>
    <button class="primary" id="go">${missing ? "Trotzdem direkt starten" : "Quiz starten"}</button>
    <p class="fine">${FINE}</p>
  </section>`;
  app.querySelectorAll("a[data-quiz]").forEach(a => a.onclick = e => { e.preventDefault(); openOther(a.dataset.quiz); });
  document.getElementById("go").onclick = () => { idx = 0; render(); };
  window.scrollTo(0,0);
}

function render(){
  const L = vis(), q = L[idx];
  const sel = ans[q.id] ?? (q.multi ? [] : null);
  const fromPre = PRE[q.id] && !touched[q.id] && ans[q.id] != null;
  const hasSel = q.multi ? sel.length > 0 : sel != null;
  app.innerHTML = `<section class="q fade">
    <div class="top"><button class="ghost" id="back">Zurück</button><span class="count">Frage ${idx+1} von ${L.length}</span></div>
    <div class="bar"><span style="width:${(idx/L.length)*100}%"></span></div>
    <h2>${esc(q.t)}</h2>
    ${fromPre ? `<p class="from">Übernommen aus ${PRE[q.id][1]}. Passt das noch?</p>` : ""}
    ${q.h ? `<p class="hint">${esc(q.h)}</p>` : ""}
    <div class="${q.days ? "days" : "answers"}">${q.a.map(a => {
      const on = q.multi ? sel.includes(a[1]) : sel === a[1];
      return `<button class="ans${q.multi?" multi":""}" data-v="${a[1]}" aria-pressed="${on}"${q.days?` aria-label="${TAGE[+a[1]]}"`:""}><span class="dot"></span><span>${esc(a[0])}</span></button>`;
    }).join("")}</div>
    ${(q.multi || hasSel) ? `<button class="primary next" id="next" ${hasSel?"":"disabled"}>${idx===L.length-1?"Wochenplan anzeigen":"Weiter"}</button>` : ""}
  </section>`;
  document.getElementById("back").onclick = () => { if(idx===0) start(); else { idx--; render(); } };
  app.querySelectorAll(".ans").forEach(b => b.onclick = () => choose(b.dataset.v));
  const nx = document.getElementById("next"); if(nx) nx.onclick = advance;
  window.scrollTo(0,0);
}
function choose(v){
  const q = vis()[idx];
  touched[q.id] = true;
  if(q.multi){
    const none = q.a.find(a => a[1] === "nichts");
    let s = Array.isArray(ans[q.id]) ? [...ans[q.id]] : [];
    if(none && v === "nichts") s = s.includes(v) ? [] : [v];
    else { s = s.filter(x => x !== "nichts"); s = s.includes(v) ? s.filter(x => x !== v) : [...s, v]; }
    ans[q.id] = s; render(); return;
  }
  ans[q.id] = v;
  app.querySelectorAll(".ans").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v));
  setTimeout(advance, reduce() ? 0 : 260);
}
function advance(){ const L = vis(); if(idx < L.length-1){ idx++; render(); } else result(); }

/* ---------- Regeln ---------- */
const DICKE = ["fein","duenn","normal","dick","sehrdick"];
const KOPFNAME = {normal:"unkomplizierter",fettend:"schnell fettender",trocken:"trockener",sensibel:"sensibler",schuppen:"schuppiger"};
const COND = ["Wonder Water oder ein leichter Conditioner","ein leichter Conditioner","ein Conditioner mit mittlerer Reichhaltigkeit","ein reichhaltiger Conditioner","ein sehr reichhaltiger Conditioner"];
const LEAVE_FEUCHT = ["ein Leave-in-Spray","ein Leave-in-Spray oder ein leichtes Leave-in-Serum","eine Leave-in-Lotion oder ein Leave-in-Serum","eine Leave-in-Creme","eine reichhaltige Leave-in-Creme"];
const LEAVE_TROCKEN = ["ein Leave-in-Spray","ein Leave-in-Spray oder ein leichtes Serum","ein Leave-in-Serum oder eine leichte Lotion","ein Leave-in-Serum oder eine Leave-in-Creme","eine Leave-in-Creme"];
const OEL = ["ein Tropfen Trockenöl nur in die Spitzen","ein Tropfen Trockenöl nur in die Spitzen","ein Haaröl in Längen und Spitzen","ein reichhaltigeres Haaröl in Längen und Spitzen","ein reichhaltiges Haaröl in Längen und Spitzen"];
const HS = [
 "ein trockenes Hitzeschutzspray. Es ist von der Textur wie Haarspray oder Trockenshampoo, beschwert nicht und ist ideal auf trockenem Haar vor dem Styling. Ins feuchte Haar passt ein leichtes klassisches Hitzeschutzspray.",
 "ein trockenes Hitzeschutzspray. Es ist von der Textur wie Haarspray oder Trockenshampoo, beschwert nicht und ist ideal auf trockenem Haar vor dem Styling. Ins feuchte Haar passt ein leichtes klassisches Hitzeschutzspray.",
 "ein klassisches Hitzeschutzspray oder ein Leave-in-Serum mit Hitzeschutz. Wenn deine Längen trocken sind, darf es auch ein Haaröl mit Hitzeschutz sein.",
 "eine Leave-in-Creme mit Hitzeschutz oder ein Haaröl mit Hitzeschutz.",
 "eine Leave-in-Creme mit Hitzeschutz oder ein Haaröl mit Hitzeschutz."
];
const PREWASH = ["LWC- oder CWC-Methode","LWC- oder CWC-Methode","CWC- oder MWC-Methode","ÖWC- oder MWC-Methode","ÖWC- oder MWC-Methode"];

/* Waschtage möglichst gleichmäßig verteilen, gern auf Sporttage */
function pickWashDays(n, sport){
  if(n >= 7) return [0,1,2,3,4,5,6];
  let best = null, bestScore = -1e9;
  const ideal = 7 / n;
  for(let mask = 0; mask < 128; mask++){
    const d = [0,1,2,3,4,5,6].filter(i => mask & (1<<i));
    if(d.length !== n) continue;
    let pen = 0;
    d.forEach((x,i) => { const gap = (i < n-1 ? d[i+1] : d[0] + 7) - x; pen += (gap - ideal) ** 2; });

  let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch(e){}
  if(!ok){ const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { ok = document.execCommand("copy"); } catch(e){} ta.remove(); }
  const el = document.getElementById("copied"); if(el) el.textContent = ok ? "Kopiert. Du kannst ihn jetzt in deine Notizen einfügen." : "Kopieren hat leider nicht geklappt.";
}

start();
</script>
