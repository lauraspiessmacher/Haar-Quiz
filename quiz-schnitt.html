<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haarschnitt-Check</title>
<style>
:root{
  --bg:#382F2E;
  --surface:#433836;
  --cream:#F3ECE2;
  --muted:#C9BCAE;
  --line:rgba(243,236,226,.5);
  --line-soft:rgba(243,236,226,.18);
  --taupe:#9E8C80;
  --sand:#C9BCAE;
  --warn-bg:#4A3D35;
  --serif:"Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", "Noto Serif", Georgia, serif;
  --sans:"Avenir Next", Avenir, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#382F2E; --cream:#F3ECE2; } }
:root[data-theme="dark"]{ --bg:#382F2E; --cream:#F3ECE2; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font-family:var(--sans);font-weight:400;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:28px 22px 48px}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.1}
p{margin:0 0 14px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sand);outline-offset:3px}

/* Start */
.start{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;position:relative}
.strand{position:absolute;top:0;right:-22px;width:62%;max-width:300px;opacity:.55;pointer-events:none}
.by{font-size:14px;color:var(--muted);margin-bottom:28px;letter-spacing:.02em}
.start h1{font-size:clamp(46px,13vw,68px);letter-spacing:-.01em;margin-bottom:22px;max-width:9ch}
.start .lead{font-size:18px;color:var(--cream);max-width:34ch}
.start .how{color:var(--muted);font-size:15px;max-width:38ch;margin-bottom:30px}
.primary{display:block;width:100%;padding:17px 20px;border:1px solid var(--cream);border-radius:999px;background:var(--cream);color:var(--bg);font-weight:500;font-size:17px;cursor:pointer}
.primary:active{transform:scale(.99)}
.ghost{background:none;border:none;color:var(--muted);font-size:15px;cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:4px}
.fine{font-size:13px;color:var(--muted);line-height:1.5;margin-top:26px;border-top:1px solid var(--line-soft);padding-top:16px}

/* Question */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;min-height:40px}
.count{font-size:14px;color:var(--muted)}
.bar{height:2px;background:var(--line-soft);border-radius:2px;overflow:hidden;margin-bottom:38px}
.bar span{display:block;height:100%;background:var(--cream);transition:width .35s ease}
.q h2{font-size:clamp(30px,8vw,38px);margin-bottom:12px}
.hint{color:var(--muted);font-size:15px;margin-bottom:22px}
.answers{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.ans{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:transparent;cursor:pointer;font-size:16.5px;line-height:1.4;transition:background .15s,border-color .15s,color .15s}
.ans .dot{flex:0 0 18px;height:18px;margin-top:2px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}
.ans.multi .dot{border-radius:5px}
.ans[aria-pressed="true"]{background:var(--cream);color:var(--bg);border-color:var(--cream)}
.ans[aria-pressed="true"] .dot{border-color:var(--bg);background:var(--bg)}
.ans[aria-pressed="true"] .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--cream)}
.ans.multi[aria-pressed="true"] .dot::after{border-radius:1px}
@media (hover:hover){.ans:hover{border-color:var(--cream)}}
.next{margin-top:26px}
.next[disabled]{opacity:.35;cursor:default}

/* Result */
.res-kicker{font-size:15px;color:var(--muted);margin-bottom:8px}
.res h1{font-size:clamp(44px,12vw,62px);margin-bottom:20px}
.res .intro{font-size:18px;margin-bottom:28px}
.block{border-top:1px solid var(--line-soft);padding:22px 0 8px}
.block h3{font-size:25px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.mark{display:inline-grid;place-items:center;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;font-family:var(--sans);font-size:14px;font-weight:400}
.box{border:1px solid var(--line);border-radius:16px;padding:18px 18px 6px;margin:0 0 18px}
.box h3{font-size:22px;margin-bottom:8px}
.warn{background:var(--warn-bg);border-color:var(--sand);margin-bottom:30px}
.warn h3{color:var(--sand)}
details{border-top:1px solid var(--line-soft);padding:18px 0}
summary{cursor:pointer;font-family:var(--serif);font-size:24px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--sans);font-weight:400;font-size:24px;color:var(--muted)}
details[open] summary::after{content:"–"}
details .inner{padding-top:14px}
.tbl{overflow-x:auto;margin:6px 0 18px;border:1px solid var(--line-soft);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:14.5px}
th,td{text-align:left;padding:10px 12px;vertical-align:top;border-bottom:1px solid var(--line-soft)}
th{font-weight:500;color:var(--muted)}
tr:last-child td{border-bottom:none}
ul{padding-left:20px;margin:0 0 14px}
li{margin-bottom:8px}
.closing{font-family:var(--serif);font-size:23px;line-height:1.3;border-top:1px solid var(--line-soft);padding-top:24px;margin:10px 0 26px}
.actions{display:flex;flex-direction:column;gap:6px;align-items:center}

.fade{animation:in .3s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar span{transition:none}}

.ans.has-ico{align-items:center}
.ans .ico{flex:0 0 28px;width:28px;height:46px}
.ans[aria-pressed="true"] .ico path{stroke:#382F2E}
.res-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.res-art{flex:0 0 60px;width:60px;height:100px;margin-top:4px}
.subtype{color:var(--muted);font-size:16px;margin:-8px 0 24px}
.code{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 10px;margin-right:8px;color:var(--cream);font-size:14px}
.steps{padding-left:22px;margin:0 0 22px}
.steps li{margin-bottom:10px}
strong{font-weight:500}
.secondary{display:block;width:100%;padding:15px 20px;border:1px solid var(--cream);border-radius:999px;background:transparent;color:var(--cream);font-weight:500;font-size:16px;cursor:pointer}
.copied{font-size:14px;color:var(--muted);min-height:20px}
.actions .primary{margin-top:8px}
.links{margin-top:10px;gap:10px}
.links .secondary{margin:0}
.intro p{font-size:18px}
.box p{margin-bottom:12px}
.faces{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.ans.face{flex-direction:column;align-items:center;text-align:center;gap:8px;padding:16px 10px}
.ans.face svg{width:44px;height:58px;fill:none;stroke:currentColor;stroke-width:1.6}
.ans.face small{display:block;font-size:13.5px;color:var(--muted);line-height:1.35}
.ans.face[aria-pressed="true"] small{color:var(--bg)}
.ans.face .dot{display:none}
.prefill{font-size:14px;color:var(--sand);margin:-8px 0 16px}
.box .actions{margin:4px 0 14px}
.copying .box .actions{display:none}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>


<script>
/* ---------- Fragen ---------- */
/* Haarschnitt-Check: Orientierung aus Gesichtsform, Haar, Wunsch und aktuellem Schnitt. Ersetzt keine Friseurberatung.
   Lauras Regeln (09.10.): Nie zum Rauswachsenlassen von Stufen raten. Ohne Stufen + Wunsch nach mehr Volumen oder besserem Halt
   → 2 bis 3 Stufen nur nach Beratung beim Friseur, mit Hinweis, dass wir die Haarmenge nicht sehen. Kein Thema Ausdünnen/Effilieren.
   Kraus ist kein eigener Haartyp, sondern eine Extrafrage. Länge nur, wenn jemand offen für eine neue Länge ist. */
const FACE = {
  oval:`<ellipse cx="30" cy="38" rx="19" ry="29"/>`,
  rund:`<ellipse cx="30" cy="38" rx="24" ry="26"/>`,
  eckig:`<path d="M9 15Q9 8 16 8H44Q51 8 51 15V50Q51 64 40 67H20Q9 64 9 50Z"/>`,
  herz:`<path d="M30 70C23 65 8 47 7 27C6 13 15 8 30 8C45 8 54 13 53 27C52 47 37 65 30 70Z"/>`,
  lang:`<path d="M15 17Q15 5 30 5Q45 5 45 17V57Q45 71 30 71Q15 71 15 57Z"/>`,
  weiss:`<ellipse cx="30" cy="38" rx="21" ry="28" stroke-dasharray="3 4"/>`
};
const QS = [
 {id:"gesicht", t:"Welche Gesichtsform hast du?", face:true,
  h:"So findest du es heraus: Binde deine Haare streng nach hinten, stell dich vor den Spiegel und zeichne die Umrisse deines Gesichts mit einem Lippenstift auf dem Spiegel nach.", a:[
  ["Oval",{f:"oval",d:"etwas länger als breit, ausgewogen"}],["Rund",{f:"rund",d:"etwa so breit wie lang, weiche Kontur"}],
  ["Eckig",{f:"eckig",d:"kantiger Kiefer, Stirn und Kiefer etwa gleich breit"}],["Herzförmig",{f:"herz",d:"breitere Stirn, schmales Kinn"}],
  ["Länglich",{f:"lang",d:"deutlich länger als breit"}],["Weiß ich nicht",{f:"weiss",d:"kein Problem"}]]},
 {id:"dicke", t:"Wie dick ist ein einzelnes Haar?", h:"Nicht sicher? Das findest du im Pflege-Check heraus.", a:[
  ["Fein",{fein:1}],["Normal",{}],["Dick",{dick:1}]]},
 {id:"menge", t:"Wie viele Haare hast du? Was schätzt du?", a:[
  ["Wenig",{wenig:1}],["Normal viele",{}],["Viele",{viele:1}]]},
 {id:"struktur", t:"Wie fallen deine Haare von Natur aus, wenn sie an der Luft trocknen?", a:[
  ["Glatt",{g:"G"}],["Wellig",{g:"W"}],["Lockig",{g:"L"}],["Sehr eng gelockt, kleine Locken oder Spiralen",{g:"K"}]]},
 {id:"frizz", t:"Werden deine Haare schnell kraus?", h:"Also fliegend, aufgeplustert oder frizzy, zum Beispiel bei Regen oder hoher Luftfeuchtigkeit.", a:[
  ["Oft, vor allem bei Luftfeuchtigkeit",{frizz:1}],["Manchmal",{}],["Kaum",{}]]},
 {id:"laenge", t:"Wie lang sind deine Haare gerade?", a:[
  ["Kurz, höchstens bis zum Kinn",{}],["Etwa schulterlang",{}],["Bis zur Brust",{lang:1}],["Bis zur Taille oder länger",{lang:2}]]},
 {id:"schnitt", t:"Welchen Schnitt hast du gerade?", a:[
  ["Alles etwa gleich lang, ohne Stufen",{ohne:1}],["Nur vorne ums Gesicht kürzer (Face Framing oder Curtain Bangs)",{ohne:1,ff:1}],["Stufen im ganzen Haar",{stufen:1}],["Weiß ich nicht",{}]]},
 {id:"stufen", t:"Wie viele Stufen hast du?", show:()=>v("schnitt").stufen,
  h:"So testest du es: Kämm deine trockenen Haare nach vorne über die Schulter und schau, auf wie vielen Höhen die Haare enden.", a:[
  ["2 Stufen",{n:2}],["3 oder mehr Stufen",{n:3}],["Weiß ich nicht",{}]]},
 {id:"blow", t:"Wie gut hält ein Blowout bei dir?", h:"Also Schwung und Volumen mit Rundbürste oder Multistyler.", a:[
  ["Gut, den ganzen Tag oder länger",{gut:1}],["Geht so, ein paar Stunden",{}],["Schlecht, es fällt schnell wieder zusammen",{schlecht:1}],["Habe ich noch nie ausprobiert",{}]]},
 {id:"curl", t:"Und wie gut halten Locken vom Lockenstab?", a:[
  ["Gut, den ganzen Tag oder länger",{gut:1}],["Geht so, ein paar Stunden",{}],["Schlecht, sie hängen schnell wieder raus",{schlecht:1}],["Habe ich noch nie ausprobiert",{}]]},
 {id:"wunsch", t:"Was wünschst du dir von deinem Schnitt am meisten?", a:[
  ["Volumen und Schwung",{w:"vol"}],["Glatt und gepflegt",{w:"glatt"}],["Meine Wellen oder Locken betonen",{w:"struktur"}],["Pflegeleicht, wenig Styling",{w:"easy"}]]},
 {id:"zeit", t:"Wie viel Zeit nimmst du dir morgens für deine Haare?", a:[
  ["Unter 5 Minuten",{wenigZeit:1}],["5 bis 15 Minuten",{}],["Mehr als 15 Minuten",{}]]},
 {id:"lwunsch", t:"Wie stehst du zur Länge?", a:[
  ["Die Länge soll bleiben, es geht mir um Stufen und Form",{}],["Ich bin offen für eine neue Länge",{offen:1}],["Ich möchte kürzer, weiß aber nicht, wie kurz",{offen:1,kuerzer:1}]]},
 {id:"hals", t:"Wie viel Hals siehst du zwischen Kinn und Schultern?", show:()=>v("lwunsch").offen,
  h:"Steck deine Haare hoch und schau gerade in den Spiegel, oder lass jemand anderen schauen.", a:[
  ["Eher wenig, mein Hals wirkt kurz",{hals:"kurz"}],["Mittel",{}],["Eher viel, mein Hals wirkt lang",{hals:"lang"}],["Weiß ich nicht",{}]]},
 {id:"kinn", t:"Machst du den Kinn-Ohr-Test?", show:()=>v("lwunsch").offen,
  h:"Ein Trick von Friseuren: Halte einen Stift waagerecht unter dein Kinn und ein Lineal senkrecht an dein Ohrläppchen. Miss, wie weit es vom Ohrläppchen bis zum Stift ist.", a:[
  ["Weniger als 5,7 cm",{kinn:"kurz"}],["5,7 cm oder mehr",{kinn:"lang"}],["Mag ich nicht testen",{}]]},
 {id:"spliss", t:"Hast du Spliss oder abgebrochene Haare?", a:[
  ["Ja, nur in den Spitzen",{spliss:1}],["Ja, auch weiter oben in den Längen",{spliss:2}],["Nein",{}],["Weiß ich nicht",{}]]}
];
const FINE = "Ich bin keine Friseurin. Dieser Check ist eine Orientierung anhand deiner Gesichtsform, deiner Haare und deines Wunsches. Für eine richtige Beratung geh bitte zum Friseur: Dort sieht dich jemand in echt und kann auch Wirbel, Haarmenge und Haarfarbe mit einbeziehen. Nimm am besten Fotos von Schnitten mit, die dir gefallen.";
const FACENAME = {oval:"oval", rund:"rund", eckig:"eckig", herz:"herzförmig", lang:"länglich"};
const STYLE_TIPS = `<ul><li>Arbeite mit dünnen Strähnen, dann wird jede Strähne gleichmäßig warm.</li><li>Lass jede Welle oder Locke abkühlen, bevor du sie loslässt, und fixier am Ende mit einem kurzen Kaltluftstoß.</li><li>Ein Lockenstab hält meistens länger als Locken vom Multistyler, weil er punktueller und mit mehr Hitze arbeitet.</li></ul>`;

/* ---------- Ablauf ---------- */
const app = document.getElementById("app");
let ans = {}, pos = 0, pre = {};
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const reduce = () => window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const v = id => { const q = QS.find(q=>q.id===id); return ans[id]==null ? {} : q.a[ans[id]][1]; };
const visible = () => QS.filter(q => !q.show || q.show());
const startArt = `<svg class="strand" viewBox="0 0 300 420" fill="none" aria-hidden="true">
  <path d="${(()=>{let d="M255 0";for(let y=0;y<=420;y+=4){d+=" L"+(255-y*0.45+10*Math.sin(y/22)).toFixed(1)+" "+y;}return d;})()}" stroke="#F3ECE2" stroke-width="1"/>
  <path d="${(()=>{let d="M285 0";for(let y=0;y<=420;y+=2){d+=" L"+(285-y*0.45+14*Math.sin(y/9)).toFixed(1)+" "+y;}return d;})()}" stroke="#9E8C80" stroke-width="1"/></svg>`;
/* Haardicke aus „Meine Haare“ übernehmen (vorausgewählt, änderbar) */
function prefill(){
  pre = {};
  try { const me = JSON.parse(localStorage.getItem("meineHaare")||"null") || {};
    const m = {fein:0, duenn:0, normal:1, dick:2, sehrdick:2}[me.dicke]; if(m!=null){ ans.dicke = m; pre.dicke = 1; } } catch(e){}
}
function start(){
  ans = {}; pos = 0;
  app.innerHTML = `<section class="start fade">${startArt}
    <div class="by">Ein Quiz von Laura, deiner Haarpflege-Bestie</div>
    <h1>Welcher Haarschnitt passt zu dir?</h1>
    <p class="lead">Stufen oder gerade Spitzen, kurz oder lang? Du bekommst eine Orientierung aus deiner Gesichtsform, deinen Haaren und deinem Wunsch, die du mit zum Friseur nehmen kannst.</p>
    <p class="how">13 bis 16 kurze Fragen, ungefähr drei Minuten.</p>
    <button class="primary" id="go">Quiz starten</button>
    <p class="fine">${FINE}</p>
  </section>`;
  document.getElementById("go").onclick = () => { prefill(); pos = 0; render(); };
  window.scrollTo(0,0);
}
function render(){
  const list = visible(), q = list[pos], sel = ans[q.id] ?? null;
  const btns = q.face
    ? `<div class="faces">${q.a.map((a,i)=>`<button class="ans face" data-i="${i}" aria-pressed="${sel===i}"><svg viewBox="0 0 60 76" aria-hidden="true">${FACE[a[1].f]}</svg><span>${esc(a[0])}<small>${esc(a[1].d)}</small></span></button>`).join("")}</div>`
    : `<div class="answers">${q.a.map((a,i)=>`<button class="ans" data-i="${i}" aria-pressed="${sel===i}"><span class="dot"></span><span>${esc(a[0])}</span></button>`).join("")}</div>`;
  app.innerHTML = `<section class="q fade">
    <div class="top"><button class="ghost" id="back">Zurück</button><span class="count">Frage ${pos+1} von ${list.length}</span></div>
    <div class="bar"><span style="width:${(pos/list.length)*100}%"></span></div>
    <h2>${esc(q.t)}</h2>
    ${q.h ? `<p class="hint">${esc(q.h)}</p>` : ""}
    ${pre[q.id] && sel!=null ? `<p class="prefill">Aus „Meine Haare“ übernommen. Du kannst es hier ändern.</p>` : ""}
    ${btns}
    ${sel!=null ? `<button class="primary next" id="weiter">Weiter</button>` : ""}
  </section>`;
  document.getElementById("back").onclick = () => { if(pos===0) start(); else { pos--; render(); } };
  const w = document.getElementById("weiter"); if(w) w.onclick = advance;
  app.querySelectorAll(".ans").forEach(b => b.onclick = () => {
    ans[q.id] = +b.dataset.i; delete pre[q.id];
    app.querySelectorAll(".ans").forEach(x => x.setAttribute("aria-pressed", x===b));
    setTimeout(advance, reduce()?0:260);
  });
  window.scrollTo(0,0);
}
function advance(){ const list = visible(); if(pos < list.length-1){ pos++; render(); } else briefOeffnen(result); }

/* ---------- Auswertung ---------- */
function evaluate(){
  const f = {};
  visible().forEach(q => { if(ans[q.id]!=null) Object.assign(f, q.a[ans[q.id]][1]); });
  const face = v("gesicht").f, g = v("struktur").g, w = v("wunsch").w;
  const curly = g==="L" || g==="K";
  const b = v("blow"), c = v("curl");
  const holdBad = !!(b.schlecht || c.schlecht), holdGood = !holdBad && !!(b.gut || c.gut);
  return {f, face, g, w, curly, holdBad, holdGood, feinWenig: !!(f.fein && f.wenig)};
}
/* Hauptempfehlung: Stufen nach Haardicke und Haarmenge (Struktur entscheidet, wie viele) */
function cut(e){
  const {f, w, curly, feinWenig} = e;
  if(curly){
    if(f.fein) return {rec:"Nur wenige Stufen", text:"Zu viele Stufen nehmen feinen Locken die Fülle. Ein paar Stufen geben ihnen trotzdem Form."};
    if(f.dick || f.viele) return {rec:"Stufen für Form und Sprungkraft", text:"Stufen nehmen Gewicht aus den Längen. So springen deine Locken besser und bekommen eine schöne Form, statt unten breit zu werden."};
    return {rec:"Ein paar Stufen für Form", text:"Ein paar Stufen geben deinen Locken Form und Sprungkraft, ohne ihnen die Fülle zu nehmen."};
  }
  if(feinWenig){
    if(f.stufen) return {rec:"Spitzen, die dicht bleiben", text:"Bei feinem Haar mit wenig Haaren wirken die Längen voller, wenn die Spitzen möglichst dicht bleiben. Deine Stufen kannst du natürlich behalten. Sprich beim nächsten Schnitt mit deinem Friseur ab, wie deine Spitzen schön voll bleiben."};
    return {rec:"Gerade Spitzen, kaum Stufen", text:"Bei feinem Haar mit wenig Haaren lassen gerade geschnittene Spitzen die Längen dichter und voller wirken. Viele Stufen nehmen dir eher Fülle. Ein paar weiche Strähnen ums Gesicht gehen trotzdem gut."};
  }
  if(f.fein) return {rec:"Lange, weiche Stufen", text:"Wenige, lange Stufen geben deinem Haar Bewegung, ohne dass die Längen an Dichte verlieren."};
  if(f.dick || f.viele) return {rec:"Stufen, die Gewicht rausnehmen", text:"Bei dickem Haar oder vielen Haaren nehmen Stufen Gewicht aus den Längen. Die Haare fallen lockerer und lassen sich leichter stylen. Auch innenliegende Stufen, die man von außen kaum sieht, sind eine gute Möglichkeit."};
  const nach = {vol:"Für Volumen und Schwung sind lange Stufen ideal.", glatt:"Für glattes, gepflegtes Haar wirken gerade Spitzen oder lange, weiche Stufen besonders schön.", struktur:"Lange Stufen geben deinen Wellen Bewegung.", easy:"Am pflegeleichtesten sind wenige, lange Stufen."}[w] || "";
  return {rec:"Stufen nach deinem Geschmack", text:"Dein Haar verträgt fast jeden Schnitt, ob mit Stufen oder ohne. Entscheidend ist vor allem, was dir gefällt. " + nach};
}
const FACETIPS = {
  oval:"Dir steht fast jeder Schnitt, ob kurz oder lang, mit oder ohne Pony.",
  rund:"Lange Stufen, ein Seitenscheitel und etwas Volumen am Oberkopf lassen dein Gesicht schmaler wirken. Längen, die über das Kinn hinausgehen, stehen dir meist besser als ein Bob genau auf Kinnhöhe.",
  eckig:"Weiche, runde Formen und lockere Stufen auf Wangenhöhe machen deine Konturen weicher. Auch ein leicht schräger Bob steht eckigen Gesichtern gut.",
  herz:"Ein seitlicher Pony und Volumen auf Kieferhöhe gleichen die breitere Stirn aus. Ein Bob bis zum Kinn steht dir besonders gut.",
  lang:"Ein Pony und Volumen an den Seiten statt oben lassen dein Gesicht kürzer wirken. Sehr lange, glatte Haare ohne Volumen strecken es dagegen noch mehr."
};
const FACELEN = {oval:"Bei deiner Gesichtsform geht fast jede Länge.", rund:"Bei deiner Gesichtsform stehen dir Längen, die über das Kinn hinausgehen, meist besser als ein Bob genau auf Kinnhöhe.", eckig:"Bei deiner Gesichtsform stehen dir weiche Längen zwischen Kinn und Schultern meist gut.", herz:"Bei deiner Gesichtsform steht dir ein Bob bis zum Kinn besonders gut.", lang:"Bei deiner Gesichtsform stehen dir Längen zwischen Kinn und Schultern mit Volumen an den Seiten meist besser als sehr lange Haare."};
/* Länge: nur wenn jemand offen für eine neue Länge ist */
function lengthBlock(e){
  const {f, face, curly, feinWenig} = e; if(!f.offen) return null;
  const p = []; let rec;
  if(f.kinn==="kurz"){ rec = "Kurz bis kinnlang"; p.push("Beim Kinn-Ohr-Test lag dein Wert unter 5,7 cm. Das spricht dafür, dass dir kurze Schnitte gut stehen, zum Beispiel ein Bob oder sogar ein Pixie."); }
  else if(f.kinn==="lang"){ rec = "Ab dem Kinn abwärts"; p.push("Beim Kinn-Ohr-Test lag dein Wert bei 5,7 cm oder mehr. Dann stehen dir Längen ab dem Kinn abwärts meist besser als sehr kurze Schnitte, zum Beispiel ein Long Bob oder schulterlang."); }
  if(FACELEN[face]) p.push(FACELEN[face]);
  if(f.hals==="lang") p.push("Ein langer Hals verträgt kurze Schnitte und Bobs sehr gut.");
  if(f.hals==="kurz") p.push("Bei einem eher kurzen Hals wirken Schnitte, die über dem Kinn enden oder über die Schultern gehen, oft harmonischer als Längen, die genau auf Halshöhe enden.");
  if(feinWenig && f.lang) p.push("Bei feinem Haar mit wenig Haaren wirkt eine kürzere Länge oft voller als sehr lange Haare.");
  if(curly) p.push("Locken springen beim Trocknen hoch und wirken deshalb kürzer als im nassen Zustand. Plan beim Schneiden lieber etwas mehr Länge ein.");
  if(!p.length) p.push("Für eine genauere Längen-Empfehlung mach den Kinn-Ohr-Test, wenn du magst. Sonst hilft dir dein Friseur weiter.");
  return `<div class="box"><h3>${rec ? "Länge: " + esc(rec) : "Deine Länge"}</h3>${p.map(x=>`<p>${x}</p>`).join("")}</div>`;
}
/* Aktueller Schnitt + Halt (Lauras Regel: nie zum Rauswachsenlassen raten) */
function currentBlock(e){
  const {f, w, holdBad, holdGood, feinWenig, curly} = e;
  if(f.stufen){
    if(holdBad) return `<div class="box"><h3>Wenn dein Styling schnell rausfällt</h3><p>Dass Blowouts oder Locken schnell rausfallen, liegt oft an der Haarstruktur und nicht am Schnitt. Damit es länger hält:</p>${STYLE_TIPS}<div class="actions links"><button class="secondary" data-quiz="quiz-tools.html">Zum Hitze-Tool-Check</button></div></div>`;
    if(holdGood) return `<div class="box"><h3>Dein Schnitt jetzt</h3><p>Bei dir halten Blowouts und Locken mit deinem Schnitt gut. Das passt.</p></div>`;
    return "";
  }
  if(f.ohne && (w==="vol" || holdBad) && !curly){
    if(feinWenig) return `<div class="box"><h3>Mehr Volumen und besserer Halt</h3><p>Ehrlich gesagt: Bei feinem Haar mit wenig Haaren kommt Volumen vor allem vom Styling und nicht vom Schnitt. Ob ein paar weiche Stufen bei dir trotzdem für mehr Schwung sorgen, kann nur dein Friseur einschätzen, denn wir sehen deine Haare hier nicht und wissen nicht, wie viele Haare du wirklich hast.</p></div>`;
    return `<div class="box"><h3>Mehr Volumen und besserer Halt</h3>
      <p>Wenn du dir mehr Volumen wünschst oder dein Blowout länger halten soll, können zwei bis drei Stufen helfen: Sie nehmen Gewicht aus den Längen, und die Haare fallen lockerer. Lass dich dazu aber unbedingt beim Friseur beraten. Wir sehen deine Haare hier nicht und wissen nicht, wie viele Haare du wirklich hast. Bei feinem Haar oder wenig Haaren können Stufen die Längen schnell dünn wirken lassen. Dein Friseur kann einschätzen, wie viele Stufen dein Haar verträgt, damit du am Ende zufrieden bist.</p></div>`;
  }
  if(f.ohne && holdGood) return `<div class="box"><h3>Dein Schnitt jetzt</h3><p>Bei dir halten Blowouts und Locken gut. Mit deinem Schnitt bist du gut aufgestellt.</p></div>`;
  return "";
}
function result(){
  const e = evaluate(), r = cut(e), f = e.f;
  try { const all = JSON.parse(localStorage.getItem("quizErgebnisse")||"null") || {}; all.schnitt = {empfehlung:r.rec, gesicht:e.face||null}; localStorage.setItem("quizErgebnisse", JSON.stringify(all)); } catch(err){}
  const boxes = [];
  boxes.push(currentBlock(e));
  if(FACETIPS[e.face]) boxes.push(`<div class="box"><h3>Deine Gesichtsform: ${FACENAME[e.face]}</h3><p>${FACETIPS[e.face]}</p></div>`);
  boxes.push(lengthBlock(e));
  if(f.frizz) boxes.push(`<div class="box"><h3>Wenn deine Haare schnell kraus werden</h3><p>Sehr kurze Stufen stehen dann schnell ab. Lange Stufen und etwas Gewicht in den Längen halten deine Haare ruhiger. Dazu helfen Pflege gegen Frizz und, wenn du glatt föhnst, ein Styling-Spray gegen Frizz.</p><div class="actions links"><button class="secondary" data-hitze="styling">Styling-Sprays gegen Frizz ansehen</button></div></div>`);
  if(f.wenigZeit && !e.curly && !e.feinWenig) boxes.push(`<div class="box"><h3>Wenig Zeit am Morgen</h3><p>Stufen sehen bei glattem Haar oft erst nach dem Stylen richtig schön aus. Wenn du morgens kaum Zeit hast, sind wenige, lange Stufen am pflegeleichtesten.</p></div>`);
  if(f.spliss===1) boxes.push(`<div class="box"><h3>Spliss in den Spitzen</h3><p>Lass beim nächsten Termin die Spitzen schneiden, so weit, bis der Spliss weg ist. Danach gehen gesunde Spitzen nicht weiter kaputt.</p></div>`);
  if(f.spliss===2) boxes.push(`<div class="box"><h3>Spliss auch in den Längen</h3><p>Ein Splissschnitt entfernt die gesplissten Enden, die weiter oben aus den Längen herausstehen, ohne dass du Länge verlierst.</p><div class="actions links"><button class="secondary" data-wissen="splissschnitt">Mehr zum Splissschnitt</button></div></div>`);
  const meta = [e.face && e.face!=="weiss" ? "Gesicht " + FACENAME[e.face] : "", [f.fein?"feines":f.dick?"dickes":"normales", "Haar"].join(" "), f.wenig?"wenig Haare":f.viele?"viele Haare":"", {G:"glatt",W:"wellig",L:"lockig",K:"eng gelockt"}[e.g]||""].filter(Boolean).join(" · ");
  app.innerHTML = `<section class="res fade">
    <div class="top"><button class="ghost" id="back">Zurück</button><span class="count">Dein Ergebnis</span></div>
    <p class="res-kicker">Für deine Haare empfehle ich dir</p>
    <h1>${esc(r.rec)}</h1>
    <p class="subtype"><span class="code">Dein Haar</span>${esc(meta)}</p>
    <div class="intro"><p>${r.text}</p></div>
    ${boxes.filter(Boolean).join("")}
    <div class="block"><h3><span class="mark">!</span>Nur ein Vorschlag</h3><p>Dein Ergebnis ist eine Empfehlung, kein Muss. Wenn sie dir nicht gefällt oder du dir das nicht vorstellen kannst, lass es einfach. Nimm dein Ergebnis gern mit zum Friseur und lass dich dort beraten.</p>
      <p>Mein Tipp: Wenn du ein KI-Tool mit Bildfunktion hast, lade ein Foto von dir hoch und lass dir den vorgeschlagenen Schnitt zeigen. So siehst du vorher, wie er an dir wirkt und ob er dir gefällt.</p></div>
    <div class="actions"><button class="secondary" id="copyRes">Ergebnis kopieren</button><span class="copied" id="copied" role="status"></span>
      <button class="ghost" id="again">Quiz neu starten</button></div>
    <p class="fine">${FINE}</p>
  </section>`;
  document.getElementById("back").onclick = () => { pos = visible().length-1; render(); };
  document.getElementById("again").onclick = start;
  document.getElementById("copyRes").onclick = copyResult;
  app.querySelectorAll("[data-hitze]").forEach(b => b.onclick = () => goParent(p => p.showProducts("hitze", b.dataset.hitze), "haarpflege.html#hitze." + b.dataset.hitze));
  app.querySelectorAll("[data-wissen]").forEach(b => b.onclick = () => goParent(p => p.showWissen(b.dataset.wissen), "haarpflege.html#wissen." + b.dataset.wissen));
  app.querySelectorAll("[data-quiz]").forEach(b => b.onclick = () => { try { if(window.parent !== window && window.parent.openQuiz && window.parent.openQuiz(b.dataset.quiz)) return; } catch(err){} location.href = b.dataset.quiz; });
  window.scrollTo(0,0);
}
/* Sprung in den Guide (Quiz läuft dort im Overlay) */
function goParent(fn, fallback){
  try { const p = window.parent; if(p !== window && p.showProducts){ p.closeQuiz && p.closeQuiz(); fn(p); return; } } catch(e){}
  location.href = fallback;
}
/* ---------- Ergebnis kopieren ---------- */
async function copyResult(){
  const sec = app.querySelector("section");
  sec.classList.add("copying"); /* Knöpfe in den Kästen beim Kopieren ausblenden */
  const t = [...sec.children].filter(el => !el.matches(".top,.actions,.fine")).map(el => el.innerText.trim()).filter(Boolean).join("\n\n");
  sec.classList.remove("copying");
  let ok = false;
  try { await navigator.clipboard.writeText(t); ok = true; } catch(e){}
  if(!ok){ const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { ok = document.execCommand("copy"); } catch(e){} ta.remove(); }
  document.getElementById("copied").textContent = ok ? "Kopiert. Du kannst es jetzt in deine Notizen einfügen oder zum Friseur mitnehmen." : "Kopieren hat leider nicht geklappt.";
}
start();
</script>

.brf .brief .linie{width:30%;height:1px;background:rgba(56,47,46,.22);margin-top:1.1em}
.brf .teil{position:absolute;inset:0;z-index:3;pointer-events:none}
.brf .teil > div{position:absolute;inset:0}
.brf .s-l{clip-path:polygon(0 0,53% 55%,0 100%)}
.brf .s-r{clip-path:polygon(100% 0,47% 55%,100% 100%);filter:brightness(.95)}
.brf .unten{filter:drop-shadow(0 -1px 1.5px rgba(0,0,0,.16)) drop-shadow(0 -4px 6px rgba(0,0,0,.06))}
.brf .unten > div{position:absolute;inset:0;clip-path:polygon(0 100%,1% 98%,50% 43%,99% 98%,100% 100%);filter:brightness(.985)}
.brf .kl{position:absolute;left:0;right:0;top:0;height:62%;z-index:4;transform-origin:50% 0;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.2)) drop-shadow(0 7px 9px rgba(0,0,0,.10));animation:brfKlappe .8s cubic-bezier(.5,0,.3,1) 1.25s both}
.brf .kl .klappe{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,52% 98.5%,50% 100%,48% 98.5%);animation:brfInnen .8s linear 1.25s both}
.brf .licht{position:absolute;inset:0;z-index:5;pointer-events:none;mix-blend-mode:soft-light;
  background:linear-gradient(122deg,rgba(255,255,255,.55) 0%,rgba(255,255,255,0) 38%,rgba(0,0,0,0) 62%,rgba(0,0,0,.28) 100%)}
.brf .sg{position:absolute;width:21%;aspect-ratio:1;left:50%;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.45)) drop-shadow(0 5px 6px rgba(0,0,0,.18))}
.brf .sg img{position:absolute;inset:0;width:100%;height:100%;display:block}
.brf .sg-ganz,.brf .sg-u{top:62%;z-index:6}
.brf .sg-o{top:100%;animation:brfSgWeg .8s linear 1.25s both}
.brf .sg-o img{clip-path:polygon(0 0,100% 0,100% 48%,91% 51%,83% 47%,76% 52%,67% 56%,60% 50%,53% 53%,46% 48%,39% 51%,31% 55%,22% 50%,15% 53%,7% 49%,0 52%);animation:brfOben .3s ease-out .95s both}
.brf .sg-u img{clip-path:polygon(0 52%,7% 49%,15% 53%,22% 50%,31% 55%,39% 51%,46% 48%,53% 53%,60% 50%,67% 56%,76% 52%,83% 47%,91% 51%,100% 48%,100% 100%,0 100%);animation:brfUnten .3s ease-out .95s both}
.brf .sg-ganz{animation:brfDruck .5s ease .45s both}
.brf .sg-ganz img{animation:brfWeg .01s linear .95s both}
.brf .tipp{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font:13px/1.4 var(--sans,sans-serif);color:rgba(243,236,226,.5);letter-spacing:.04em}
.brf.zoom .brief{animation:brfZoom .7s cubic-bezier(.4,0,.2,1) both}
@keyframes brfIn{from{opacity:0}to{opacity:1}}
@keyframes brfOut{from{opacity:1}to{opacity:0}}
@keyframes brfWeg{to{opacity:0}}
@keyframes brfDruck{0%{transform:translate(-50%,-50%) scale(1)}45%{transform:translate(-50%,-50%) scale(.965)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes brfOben{to{transform:translate(-1.5%,-4%) rotate(-2.5deg)}}
@keyframes brfUnten{to{transform:translate(1%,3%) rotate(2deg)}}
@keyframes brfKlappe{0%{transform:rotateX(0);z-index:4}49%{z-index:4}50%{z-index:1}100%{transform:rotateX(180deg);z-index:1}}
@keyframes brfSgWeg{0%,45%{opacity:1}50%,100%{opacity:0}}
@keyframes brfInnen{0%,49%{filter:brightness(1)}50%{filter:brightness(.8)}100%{filter:brightness(.86)}}
@keyframes brfZiehen{from{transform:translateY(0)}to{transform:translateY(-60%)}}
@keyframes brfZoom{from{transform:translateY(-60%)}to{transform:translateY(-78%) scale(1.1);opacity:0}}
@media (prefers-reduced-motion:reduce){ .brf{display:none} }
